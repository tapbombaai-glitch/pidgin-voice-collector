<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pidgin Voice</title><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:#fff;padding:10px}.c{max-width:600px;margin:auto}.card{background:rgba(255,255,255,.14);border-radius:18px;padding:14px;margin:12px 0}.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:800;margin:7px 0}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;margin:7px 0}.y{background:#feca57;color:#000}.g{background:#2ed573;color:#000}</style></head><body><div class="c">
<h2 style="text-align:center">🎙️ Pidgin Voice</h2>
<div class="card"><b>📢 From Ademi</b><div id="annList" style="font-size:13px;margin-top:8px">Loading...</div></div>
<div class="card" style="text-align:center;background:linear-gradient(135deg,#2ed573,#17a589)"><h3>🗣️ Gist & Earn</h3><select id="topic"><option>Market</option><option>Football</option><option>Family</option></select><button class="btn y" onclick="findPartner()">🔍 Find Partner</button><p id="mStat" style="font-size:12px"></p></div>
<div class="card" style="text-align:center"><div style="width:90px;height:90px;background:#feca57;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:40px">🎤</div><h3 id="tm">00:00</h3><button class="btn y" id="recBtn" onclick="window.rec()">Start Rec</button><input id="nm" placeholder="Your name"><select id="loc"><option>Location</option><option>Lagos</option><option>Warri</option><option>PH</option><option>Abuja</option></select><textarea id="tr" rows="3" placeholder="Type your Pidgin here..."></textarea><label style="font-size:12px"><input type="checkbox" id="cs" style="width:18px"> I agree</label><button class="btn g" id="svBtn" onclick="window.save()" style="display:none">💾 Save Voice</button><audio id="aud" controls style="width:100%;display:none;margin-top:8px"></audio></div>
<div class="card"><h4>Recent Voices (Best on Top 🤖)</h4><div id="listP">Loading...</div></div>
</div>
<script>
const SUPA_URL="https://rupuxvpupdhlhxgjrbsh.supabase.co";const SUPA_KEY="sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY";const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);
let mr,blobs=[],isRec=false,tInt,sec=0,recog=null,finalT='',ab=null;
function initAI(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;recog=new SR();recog.continuous=true;recog.interimResults=true;recog.lang='en-NG';recog.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalT+=e.results[i][0].transcript+' ';else t+=e.results[i][0].transcript;}document.getElementById('tr').value=finalT+t;}}initAI();
window.rec=async function(){if(!isRec){finalT='';document.getElementById('tr').value='';let s=await navigator.mediaDevices.getUserMedia({audio:true});if(recog)try{recog.start()}catch(e){};mr=new MediaRecorder(s);blobs=[];mr.ondataavailable=e=>{if(e.data.size>0)blobs.push(e.data)};mr.onstop=()=>{ab=new Blob(blobs,{type:'audio/webm'});document.getElementById('aud').src=URL.createObjectURL(ab);document.getElementById('aud').style.display='block';document.getElementById('svBtn').style.display='block';};mr.start();isRec=true;document.getElementById('recBtn').textContent='⏹️ Stop';sec=0;tInt=setInterval(()=>{sec++;let m=String(Math.floor(sec/60)).padStart(2,'0');let ss=String(sec%60).padStart(2,'0');document.getElementById('tm').textContent=m+':'+ss},1000)}else{if(recog)try{recog.stop()}catch(e){};if(mr&&mr.state!=='inactive')mr.stop();mr.stream.getTracks().forEach(t=>t.stop());isRec=false;clearInterval(tInt);document.getElementById('recBtn').textContent='🎤 Rec Again';}}
window.save=async function(){let name=document.getElementById('nm').value||'Anon';let tr=document.getElementById('tr').value;let loc=document.getElementById('loc').value;let cs=document.getElementById('cs').checked;if(!ab)return alert('Record first');if(!tr)return alert('Add transcript');if(!cs)return alert('Tick agree');document.getElementById('svBtn').textContent='Saving...';let fn=Date.now()+'.webm';let up=await supa.storage.from('voices').upload(fn,ab);if(up.error){alert(up.error.message);return}let url=supa.storage.from('voices').getPublicUrl(fn).data.publicUrl;await supa.from('voices').insert([{name:name,audio_url:url,transcript:tr,location:loc,consent:cs,quality_score:50,duration_seconds:sec}]);alert('Saved! Chairman go inspect for panel');location.reload()}
async function loadVoices(){let {data}=await supa.from('voices').select('*').order('quality_score',{ascending:false}).limit(40);if(!data||!data.length){document.getElementById('listP').innerHTML='No voices yet';return}document.getElementById('listP').innerHTML=data.map(v=>`<div style="background:rgba(0,0,0,.25);padding:10px;border-radius:12px;margin:8px 0;font-size:13px;border-left:5px solid ${v.quality_score>=75?'#2ed573':v.quality_score>=45?'#ffa502':'#ff4757'}"><b>${v.name||v.user_name}</b> <small>${v.quality_score||50}% ⏱️${v.duration_seconds||v.duration||0}s ${v.status||''}</small><br><small>${(v.transcript||'').slice(0,80)}</small><br><audio controls src="${v.audio_url}" style="width:100%;height:30px;margin-top:6px"></audio></div>`).join('')}
async function loadAnn(){let {data}=await supa.from('announcements').select('*').order('created_at',{ascending:false}).limit(5);document.getElementById('annList').innerHTML=data&&data.length?data.map(a=>`<div style="background:rgba(0,0,0,.3);padding:8px;border-radius:8px;margin:5px 0"><b>${a.title}</b><br><small>${a.message}</small></div>`).join(''):'Welcome! Drop Pidgin voice!'}
window.findPartner=async function(){let name=document.getElementById('nm').value||'Anon_'+Date.now();document.getElementById('mStat').textContent='🔍 Searching...';let {data}=await supa.from('conversation_queue').select('*').limit(1);if(data&&data.length){let room='room_'+Date.now();await supa.from('conversation_rooms').insert([{id:room,user_A:data[0].user_id,user_B:name,status:'matched'}]);await supa.from('conversation_queue').delete().eq('id',data[0].id);window.location.href='room.html?id='+room}else{await supa.from('conversation_queue').insert([{user_id:name}]);document.getElementById('mStat').textContent='⏳ Waiting...';setInterval(async()=>{let {data:r}=await supa.from('conversation_rooms').select('*').eq('user_B',name).limit(1);if(r&&r.length)window.location.href='room.html?id='+r[0].id},4000)}}
loadVoices();loadAnn();
</script></body></html>
