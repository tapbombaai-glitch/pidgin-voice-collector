<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ademi - Pidgin Voice Collector</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
  body{background:#0a0a0a;color:white;min-height:100vh;padding:20px}
  .container{max-width:480px;margin:0 auto}
  h1{font-size:28px;margin-bottom:8px}
  .sub{color:#888;margin-bottom:24px}
  .prompt-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:20px;margin-bottom:20px}
  .prompt-label{color:#666;font-size:12px;letter-spacing:1px;margin-bottom:8px}
  .prompt-text{font-size:22px;font-weight:700;line-height:1.3}
  .record-area{background:#1a1a1a;border-radius:24px;padding:24px;text-align:center;border:1px solid #2a2a2a}
  .mic-btn{width:88px;height:88px;border-radius:50%;border:none;background:white;color:black;font-size:36px;cursor:pointer;transition:.2s}
  .mic-btn.recording{background:#ff2d2d;color:white;animation:pulse 1.2s infinite}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  .timer{font-size:42px;font-weight:800;margin:16px 0;letter-spacing:-1px}
  .hint{color:#666;font-size:14px}
  .actions{display:flex;gap:12px;margin-top:20px}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
  .btn-play{background:white;color:black}
  .btn-save{background:#1a1a1a;color:white;border:1px solid #333}
  .list{margin-top:32px}
  .item{background:#141414;border:1px solid #222;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .item audio{height:32px}
</style>
</head>
<body>
<div class="container">
  <h1>Ademi Voice</h1>
  <p class="sub">Collect correct Naija Pidgin voice — tap record, yarn the prompt</p>

  <div class="prompt-card">
    <div class="prompt-label">CURRENT PROMPT • <span id="count">1 / 8</span></div>
    <div class="prompt-text" id="promptText">How you dey? How body?</div>
  </div>

  <div class="record-area">
    <button class="mic-btn" id="micBtn">🎙️</button>
    <div class="timer" id="timer">00:00</div>
    <div class="hint" id="hint">Tap mic to start record</div>
    <div class="actions" id="actions" style="display:none">
      <button class="btn btn-play" id="playBtn">▶ Play</button>
      <button class="btn btn-save" id="saveBtn">💾 Save & Next</button>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
const prompts = [
  "How you dey? How body?",
  "Wetin you chop today?",
  "Abeg, where you dey go?",
  "No wahala, I go come tomorrow",
  "This Lagos traffic too much!",
  "My guy, how far that your work?",
  "Shebi you don chop? Make you rest",
  "Omo, this thing sweet die!"
];
let idx=0, rec, chunks=[], start, timerInt, audioBlob, audioUrl;
const promptText=document.getElementById('promptText');
const count=document.getElementById('count');
const micBtn=document.getElementById('micBtn');
const timerEl=document.getElementById('timer');
const hint=document.getElementById('hint');
const actions=document.getElementById('actions');
const list=document.getElementById('list');

function updatePrompt(){
  promptText.textContent=prompts[idx];
  count.textContent=`${idx+1} / ${prompts.length}`;
}
updatePrompt();

micBtn.onclick = async () => {
  if(micBtn.classList.contains('recording')){
    rec.stop();
    micBtn.classList.remove('recording');
    clearInterval(timerInt);
    hint.textContent="Recording done! Play or Save";
    actions.style.display="flex";
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(stream);
    chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
      audioBlob=new Blob(chunks,{type:'audio/webm'});
      audioUrl=URL.createObjectURL(audioBlob);
    };
    rec.start();
    micBtn.classList.add('recording');
    start=Date.now();
    timerInt=setInterval(()=>{
      const s=Math.floor((Date.now()-start)/1000);
      timerEl.textContent=`00:${String(s).padStart(2,'0')}`;
    },200);
    hint.textContent="Recording... tap again to stop";
    actions.style.display="none";
  }catch(e){alert("Mic permission need — allow mic for this site"); }
};

document.getElementById('playBtn').onclick=()=>{
  if(audioUrl) new Audio(audioUrl).play();
};
document.getElementById('saveBtn').onclick=()=>{
  const item=document.createElement('div');
  item.className='item';
  item.innerHTML=`<div><b>${prompts[idx]}</b><br><small style="color:#666">${new Date().toLocaleTimeString()}</small></div><audio controls src="${audioUrl}"></audio>`;
  list.prepend(item);
  // download
  const a=document.createElement('a');
  a.href=audioUrl;
  a.download=`ademi-${idx+1}-${Date.now()}.webm`;
  a.click();
  
  idx=(idx+1)%prompts.length;
  updatePrompt();
  timerEl.textContent="00:00";
  hint.textContent="Tap mic to start record";
  actions.style.display="none";
};
</script>
</body>
</html>
