<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ademi Pidgin Voice - Anti-Scam</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0f0c29;color:#fff;padding:12px}
.card{background:rgba(255,255,255,.1);border-radius:14px;padding:14px;margin:12px 0;border:1px solid rgba(255,255,255,.15)}
.btn{padding:14px;border-radius:12px;border:none;font-weight:900;width:100%;margin:6px 0;font-size:16px;cursor:pointer}
input,textarea,select{width:100%;padding:12px;border-radius:10px;background:rgba(0,0,0,.4);color:#fff;border:1px solid #555;margin:6px 0}
</style>
</head>
<body>
<h2 style="text-align:center">🎙️ Ademi Pidgin Voice</h2>
<p style="text-align:center;font-size:11px;opacity:.7">Anti-Scam • Silence Removed • Auto-Save</p>

<div id="myHoursCard" style="background:linear-gradient(135deg,#667eea,#764ba2);padding:14px;border-radius:14px;margin:12px 0;color:#fff;border:2px solid yellow;display:none"><h4 style="text-align:center">⏱️ My Hours</h4><p id="myHoursText" style="text-align:center;font-size:14px;margin:8px 0"></p><div id="myHoursBreakdown" style="font-size:12px"></div></div>

<div class="card">
<input id="userName" placeholder="Your name e.g Adiam" oninput="localStorage.setItem('pidgin_user_name',this.value)">
<select id="vLoc"><option>Port Harcourt</option><option>Lagos</option><option>Abuja</option><option>Warri</option><option>Other</option></select>
<textarea id="vTranscript" rows="3" placeholder="Talk Pidgin — e must be real Pidgin, not nonsense" readonly style="background:rgba(255,255,0,.1)"></textarea>
<p id="recStatus" style="font-size:13px;margin:8px 0;color:#2ed573;font-weight:bold;background:rgba(0,0,0,.3);padding:8px;border-radius:8px">✅ Ready - Talk REAL Pidgin, no scam!</p>
<button class="btn" id="recBtn" style="background:#ff4757;color:#fff" onclick="toggleRec()">🔴 START</button>
</div>

<div class="card"><h4>🎧 My Voices — Green = Good, Red = Scam Rejected</h4><div id="myVoices">Loading...</div></div>
<div class="card" style="text-align:center"><button class="btn" style="background:rgba(255,255,255,.15)" onclick="location.href='ademi.html'">👑 Chairman Panel</button></div>

<script>
const SUPA_URL="https://rupuxvpupdhlhxgjrbsh.supabase.co";const SUPA_KEY="sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY";const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let mediaRec,chunks=[],audioBlob,startTime,recognition,finalTranscript='',autoSaveTimer,audioContext,analyser,speakingTime=0,lastCheck=0;
document.getElementById('userName').value=localStorage.getItem('pidgin_user_name')||'';

function setupSpeech(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
 let rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang='en-NG';
 rec.onresult=(e)=>{let inter=''; for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal) finalTranscript+=e.results[i][0].transcript+' '; else inter+=e.results[i][0].transcript;} document.getElementById('vTranscript').value=finalTranscript+inter;};
 return rec;
}

// ANTI-SCAM CHECKER
function checkScam(transcript, talkingTime){
 let t = (transcript||'').toLowerCase().trim();
 let words = t.split(/\s+/).filter(w=>w.length>0);
 if(!t || t.length < 8) return {ok:false, reason:`Too short "${t}" - talk real Pidgin at least 3 seconds`};
 if(words.length < 3) return {ok:false, reason:`Only ${words.length} words "${t}" - need at least 3 words`};
 if(/(.)\1{4,}/.test(t)) return {ok:false, reason:`Nonsense detected "${t.slice(0,20)}" - no "aaaa" or "hhhh"`};
 // Check repeat same word
 let counts={}; words.forEach(w=>counts[w]=(counts[w]||0)+1);
 let maxRepeat = Math.max(...Object.values(counts));
 if(words.length>=3 && maxRepeat/words.length > 0.6) return {ok:false, reason:`Same word repeated "${Object.keys(counts)[0]}" x${maxRepeat} - talk different words`};
 if(talkingTime < 1.2) return {ok:false, reason:`Talking time only ${talkingTime.toFixed(1)}s - too short, talk more`};
 // Pidgin keywords - must have at least 1
 let pidginWords = ['how far','na','dey','abi','shey','walahi','weti','wetin','oga','abeg','make','no be','e be','you dey','i dey','we dey','una','dis','dat','wey','chop','come','go','commot','sabi','pikin','waka','yarn','gbege','wahala','mumu','japa','how you dey','my name na','i be','you be','for here','for port','lagos','naija','pidgin'];
 let hasPidgin = pidginWords.some(p=>t.includes(p));
 let hasPidginShort = /\b(na|dey|abi|oga|abeg|una|wey|sabi|waka|wahal|pikin)\b/.test(t);
 if(!hasPidgin &&!hasPidginShort && words.length<8){
   return {ok:false, reason:`No Pidgin word detected in "${t.slice(0,40)}" - must speak Pidgin like "How far na me dey..."`};
 }
 // Block pure English like "hello how are you"
 let pureEnglish = ['hello how are you','my name is','thank you very much','good morning sir'];
 if(pureEnglish.some(p=>t.includes(p)) &&!hasPidginShort) return {ok:false, reason:`Speak Pidgin, not pure English "${t.slice(0,40)}" - use Pidgin!`};
 return {ok:true, reason:'Good Pidgin'};
}

async function toggleRec(){
 if(mediaRec && mediaRec.state==='recording'){
   mediaRec.stop(); if(recognition) try{recognition.stop();}catch(e){} if(audioContext) try{audioContext.close();}catch(e){}
   document.getElementById('recBtn').innerText='⏳ Checking for scam...';
   let total=(Date.now()-startTime)/1000; let silent=total-speakingTime;
   document.getElementById('recStatus').innerHTML=`Total ${total.toFixed(1)}s - Talk ${speakingTime.toFixed(1)}s - Checking transcript...`;
   clearTimeout(autoSaveTimer); autoSaveTimer=setTimeout(()=>autoSaveVoice(total,speakingTime,silent),1000); return;
 }
 finalTranscript=''; document.getElementById('vTranscript').value=''; audioBlob=null; speakingTime=0;
 recognition=setupSpeech();
 try{
   let s=await navigator.mediaDevices.getUserMedia({audio:true});
   audioContext=new(window.AudioContext||window.webkitAudioContext)(); let src=audioContext.createMediaStreamSource(s); analyser=audioContext.createAnalyser(); analyser.fftSize=512; src.connect(analyser);
   let data=new Uint8Array(analyser.frequencyBinCount); lastCheck=Date.now();
   function checkVoice(){ if(!mediaRec||mediaRec.state!=='recording') return; analyser.getByteFrequencyData(data); let sum=0; for(let i=0;i<data.length;i++) sum+=data[i]; let avg=sum/data.length; let talking=avg>15; if(talking){speakingTime+=(Date.now()-lastCheck)/1000; document.getElementById('recStatus').innerHTML=`🔴 TALKING ${speakingTime.toFixed(1)}s Vol ${avg.toFixed(0)}`; } else {document.getElementById('recStatus').innerHTML=`🤫 Silent ${speakingTime.toFixed(1)}s Vol ${avg.toFixed(0)}`; } lastCheck=Date.now(); requestAnimationFrame(checkVoice);}
   mediaRec=new MediaRecorder(s); chunks=[]; startTime=Date.now(); mediaRec.ondataavailable=e=>chunks.push(e.data); mediaRec.onstop=()=>{audioBlob=new Blob(chunks,{type:'audio/webm'});}; mediaRec.start(); if(recognition) try{recognition.start();}catch(e){} checkVoice();
   document.getElementById('recStatus').innerText='🔴 Recording... TALK REAL PIDGIN!'; document.getElementById('recBtn').innerText='⏹️ STOP'; document.getElementById('recBtn').style.background='#ffa502';
 }catch(e){alert('Allow mic! '+e.message);}
}

async function autoSaveVoice(total, talking, silent){
 let name=document.getElementById('userName').value.trim(); if(!name){name=prompt('Your name?')||'Anon'; document.getElementById('userName').value=name; localStorage.setItem('pidgin_user_name',name);}
 if(!audioBlob){resetBtn(); return;}
 let transcript=document.getElementById('vTranscript').value.trim();
 let scamCheck = checkScam(transcript, talking);
 let approved, status, note, qual;
 if(!scamCheck.ok){
   approved=0; status='BROKEN'; qual=0; note=`❌ REJECTED SCAM: ${scamCheck.reason} | Total ${total.toFixed(1)}s Talk ${talking.toFixed(1)}s | 0h`;
   document.getElementById('recStatus').innerHTML=`❌ REJECTED! ${scamCheck.reason}<br>0 hours - Talk real Pidgin!`;
 } else {
   let ratio=talking/total; approved=talking; if(ratio<0.3) approved=talking*0.5;
   status='GOOD'; qual=Math.round((talking/total)*100); note=`✅ GOOD: ${scamCheck.reason} | Total ${total.toFixed(1)}s Talk ${talking.toFixed(1)}s Silent ${silent.toFixed(1)}s removed → Approved ${approved.toFixed(1)}s`;
   document.getElementById('recStatus').innerHTML=`✅ APPROVED! Talk ${talking.toFixed(1)}s → ${approved.toFixed(1)}s saved - Good Pidgin!`;
 }
 try{
   let fileName=`${Date.now()}_${name}.webm`; await sb.storage.from('voices').upload(fileName,audioBlob);
   let {data:urlData}=sb.storage.from('voices').getPublicUrl(fileName);
   await sb.from('voices').insert([{name:name,user_name:name,title:'Voice '+new Date().toLocaleTimeString(),transcript:transcript||'Scam attempt',location:document.getElementById('vLoc').value,duration_seconds:total,approved_duration_seconds:approved,audio_url:urlData.publicUrl,quality_score:qual,status:status,inspector_note:note}]);
   resetBtn(); loadMyVoices(); loadMyHours();
 }catch(e){alert('Save failed: '+e.message); resetBtn();}
}
function resetBtn(){document.getElementById('recBtn').innerText='🔴 START'; document.getElementById('recBtn').style.background='#ff4757'; setTimeout(()=>{document.getElementById('vTranscript').value='';},2000); audioBlob=null;}
async function loadMyVoices(){
 let myName=localStorage.getItem('pidgin_user_name')||''; if(!myName){document.getElementById('myVoices').innerHTML='Enter name';return;}
 let {data}=await sb.from('voices').select('*').eq('name',myName).order('created_at',{ascending:false}).limit(50);
 if(!data||!data.length){let r2=await sb.from('voices').select('*').eq('user_name',myName).order('created_at',{ascending:false}).limit(50); data=r2.data;}
 if(!data||!data.length){document.getElementById('myVoices').innerHTML='No voices yet';return;}
 document.getElementById('myVoices').innerHTML=data.map(v=>{
   let col=v.status==='GOOD'?'#2ed573':'#ff4757';
   return `<div style="background:rgba(0,0,0,.35);padding:10px;border-radius:10px;margin:8px 0;border-left:5px solid ${col}"><b>${v.title}</b> <span style="background:${col};color:#000;padding:2px 6px;border-radius:5px;font-size:10px">${v.status}</span><br><b>Raw ${parseFloat(v.duration_seconds||0).toFixed(1)}s → Approved ${v.approved_duration_seconds!=null?parseFloat(v.approved_duration_seconds).toFixed(1)+'s':'0s'}</b><br><small>${v.inspector_note||''}</small><br><small>📝 "${(v.transcript||'').slice(0,80)}"</small><br><audio controls src="${v.audio_url}" style="width:100%;height:28px;margin-top:4px"></audio></div>`;
 }).join('');
}
async function loadMyHours(){
 let myName=localStorage.getItem('pidgin_user_name')||''; if(!myName) return;
 let {data}=await sb.from('voices').select('*').eq('name',myName).limit(200); if(!data||!data.length){let r2=await sb.from('voices').select('*').eq('user_name',myName).limit(200); data=r2.data;} if(!data||!data.length) return;
 let raw=0,approved=0,good=0,bad=0; data.forEach(v=>{raw+=parseFloat(v.duration_seconds||0)||0; approved+=parseFloat(v.approved_duration_seconds||0)||0; if(v.status==='GOOD') good++; else bad++;});
 document.getElementById('myHoursCard').style.display='block';
 document.getElementById('myHoursText').innerHTML=`Raw: <b>${(raw/60).toFixed(1)}m</b> | Approved: <b style="color:#2ed573">${(approved/60).toFixed(1)}m</b> | Scam: <b style="color:#ff4757">${bad}</b><br><span style="background:#2ed573;color:#000;padding:6px 12px;border-radius:8px;font-weight:900;display:inline-block;margin:6px 0">✅ REAL HOURS: ${(approved/60).toFixed(1)}m = ${(approved/3600).toFixed(3)}h</span><br><small>Good: ${good} | Rejected: ${bad} | Silent removed: ${((raw-approved)/60).toFixed(1)}m</small>`;
}
loadMyVoices();loadMyHours();
</script>
</body>
</html>
