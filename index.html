<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ademi Pidgin Voice</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0c29;color:#fff;padding:16px;max-width:480px;margin:0 auto;min-height:100vh}
h1{text-align:center;font-size:22px;margin:10px 0 4px}
.subtitle{text-align:center;font-size:13px;opacity:0.7;margin-bottom:18px}
.card{background:rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.12)}
input,select,textarea{width:100%;padding:14px;border-radius:12px;background:rgba(0,0,0,0.4);color:#fff;border:1px solid #555;font-size:16px;margin-bottom:12px}
textarea{min-height:80px;resize:none}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:17px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-red{background:#ff4757;color:white}.btn-orange{background:#ffa502;color:#000}
.status-box{background:rgba(0,0,0,0.35);border-radius:12px;padding:14px;text-align:center;font-size:15px;font-weight:600;margin:12px 0;line-height:1.4}
.progress-container{background:rgba(0,0,0,0.4);border-radius:20px;height:18px;margin:12px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#ff4757,#ffa502,#2ed573);width:0%;transition:width 0.3s ease;border-radius:20px}
.hours-card{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:16px;padding:16px;text-align:center;border:2px solid #f1c40f;margin-bottom:16px}
</style>
</head>
<body>
<h1>🎙️ Ademi Pidgin Voice</h1>
<p class="subtitle">Talk minimum 2 minutes • Real Pidgin only • ₦500 per 90 mins</p>
<div id="announceBox" style="display:none;background:linear-gradient(135deg,#f1c40f,#ff9a00);border:2px solid #fff;border-radius:12px;padding:14px;margin-bottom:16px;text-align:center;font-weight:900;color:#000"></div>

<div class="hours-card"><h3 style="margin-bottom:8px;">💰 My Balance - Counting</h3><div id="myHoursText">Loading...</div></div>

<div class="card">
<div style="font-size:15px;font-weight:700;margin-bottom:10px;color:#f1c40f">🏦 Your Bank Details (Compulsory)</div>
<input id="accountName" placeholder="Account Name">
<input id="accountNumber" placeholder="Account Number" inputmode="numeric">
<input id="bankName" placeholder="Bank Name">
</div>

<div class="card">
<input id="userName" placeholder="Your name">
<select id="vLoc"><option>Port Harcourt</option><option>Lagos</option><option>Abuja</option><option>Warri</option><option>Other</option></select>
<textarea id="vTranscript" placeholder="Your Pidgin will appear here while you talk..." readonly></textarea>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
<div style="text-align:center;font-size:14px;margin-bottom:8px;font-weight:800" id="progressText">0 / 120 seconds = ₦0.00</div>
<div class="status-box" id="recStatus">✅ Ready</div>
<button class="btn btn-red" id="recBtn" onclick="toggleRec()">🔴 START RECORDING</button>
</div>

<script>
const SUPA_URL="https://rupuxvpupdhlhxgjrbsh.supabase.co";
const SUPA_KEY="sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const MIN_SECONDS=120,TARGET_SECONDS=5400,TARGET_PAY=500,RATE_PER_SECOND=TARGET_PAY/TARGET_SECONDS;
let mediaRec=null,chunks=[],audioBlob=null,recognition=null,finalTranscript='',speakingTime=0,lastCheck=0,audioContext=null,analyser=null,isRecording=false;
document.getElementById('userName').value=localStorage.getItem('pidgin_user_name')||'';
document.getElementById('accountName').value=localStorage.getItem('pidgin_account_name')||'';
document.getElementById('accountNumber').value=localStorage.getItem('pidgin_account_number')||'';
document.getElementById('bankName').value=localStorage.getItem('pidgin_bank_name')||'';
function setupSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;const rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-NG';rec.onresult=(e)=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){finalTranscript+=e.results[i][0].transcript+' ';}else{t+=e.results[i][0].transcript;}}document.getElementById('vTranscript').value=finalTranscript+t;};return rec;}
function updateProgress(){const p=Math.min((speakingTime/MIN_SECONDS)*100,100);document.getElementById('progressBar').style.width=p+'%';document.getElementById('progressText').innerText=`${Math.floor(speakingTime)} / ${MIN_SECONDS} secs = ₦${(speakingTime*RATE_PER_SECOND).toFixed(2)}`;}
async function showAnnouncement(){try{const {data}=await sb.from('announcements').select('*').order('created_at',{ascending:false}).limit(1);if(data&&data[0]&&data[0].message){const b=document.getElementById('announceBox');b.style.display='block';b.innerHTML='📢 CHAIRMAN: '+data[0].message;}}catch(e){}}
async function toggleRec(){
if(isRecording){isRecording=false;document.getElementById('recBtn').innerText='⏳ Saving...';document.getElementById('recBtn').disabled=true;if(mediaRec&&mediaRec.state!=='inactive'){mediaRec.onstop=async()=>{if(chunks.length>0){audioBlob=new Blob(chunks,{type:'audio/webm'});await processRecording();}else{resetUI();}};mediaRec.stop();}if(recognition)try{recognition.stop();}catch(e){}if(audioContext)try{audioContext.close();}catch(e){}return;}
const name=document.getElementById('userName').value.trim(),aN=document.getElementById('accountName').value.trim(),aNum=document.getElementById('accountNumber').value.trim(),bank=document.getElementById('bankName').value.trim();
if(!name||!aN||!aNum||!bank){alert('Fill all bank details + name');return;}
localStorage.setItem('pidgin_user_name',name);localStorage.setItem('pidgin_account_name',aN);localStorage.setItem('pidgin_account_number',aNum);localStorage.setItem('pidgin_bank_name',bank);
finalTranscript='';document.getElementById('vTranscript').value='';speakingTime=0;chunks=[];audioBlob=null;updateProgress();
try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});audioContext=new(window.AudioContext||window.webkitAudioContext)();const source=audioContext.createMediaStreamSource(stream);analyser=audioContext.createAnalyser();analyser.fftSize=512;source.connect(analyser);const d=new Uint8Array(analyser.frequencyBinCount);lastCheck=Date.now();function checkVoice(){if(!isRecording)return;analyser.getByteFrequencyData(d);let sum=0;for(let i=0;i<d.length;i++)sum+=d[i];const avg=sum/d.length,talking=avg>8,now=Date.now(),delta=(now-lastCheck)/1000;if(talking)speakingTime+=delta;else speakingTime+=delta*0.3;lastCheck=now;updateProgress();document.getElementById('recStatus').innerHTML= speakingTime>=MIN_SECONDS? `✅ You don reach 2 mins! = ₦${(speakingTime*RATE_PER_SECOND).toFixed(2)}<br>You fit STOP` : `🔴 Talking... ${Math.floor(speakingTime)}s = ₦${(speakingTime*RATE_PER_SECOND).toFixed(2)}`;requestAnimationFrame(checkVoice);}mediaRec=new MediaRecorder(stream);mediaRec.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data);};mediaRec.start(200);recognition=setupSpeech();if(recognition)recognition.start();isRecording=true;checkVoice();document.getElementById('recBtn').innerText='⏹️ STOP';document.getElementById('recBtn').className='btn btn-orange';}catch(err){alert(err.message);resetUI();}}
async function processRecording(){
const name=document.getElementById('userName').value.trim(),tr=document.getElementById('vTranscript').value.trim(),loc=document.getElementById('vLoc').value,aN=document.getElementById('accountName').value.trim(),aNum=document.getElementById('accountNumber').value.trim(),bank=document.getElementById('bankName').value.trim(),saved=Math.round(speakingTime);
if(!audioBlob&&chunks.length>0)audioBlob=new Blob(chunks,{type:'audio/webm'});if(!audioBlob||saved<MIN_SECONDS){document.getElementById('recStatus').innerText='Only '+saved+'s';resetUI();return;}
document.getElementById('recStatus').innerHTML=`✅ Your ${saved}s = ₦${(saved*RATE_PER_SECOND).toFixed(2)} don save! Waiting Chairman`;
try{const fn=Date.now()+'_'+name.replace(/\s+/g,'_')+'.webm';const{error:upErr}=await sb.storage.from('voices').upload(fn,audioBlob,{contentType:'audio/webm'});if(upErr)throw upErr;const{data:urlData}=sb.storage.from('voices').getPublicUrl(fn);await sb.from('voices').insert([{name:name,user_name:name,title:name+' - '+(speakingTime/60).toFixed(1)+'m',transcript:tr||'(Audio)',location:loc,duration_seconds:saved,approved_duration_seconds:0,audio_url:urlData.publicUrl,status:'UNCHECKED',account_name:aN,account_number:aNum,bank_name:bank}]);}catch(err){alert('Save failed '+err.message);}resetUI();loadMyHours();}
function resetUI(){isRecording=false;document.getElementById('recBtn').innerText='🔴 START RECORDING';document.getElementById('recBtn').className='btn btn-red';document.getElementById('recBtn').disabled=false;speakingTime=0;updateProgress();}
async function loadMyHours(){
const myName=localStorage.getItem('pidgin_user_name')||'';if(!myName){document.getElementById('myHoursText').innerHTML='Enter name to see balance';return;}
let {data}=await sb.from('voices').select('*').ilike('name',myName).limit(300);
if(!data||data.length===0){const r2=await sb.from('voices').select('*').ilike('user_name',myName).limit(300);data=r2.data;}
let approvedSecs=0,waitingSecs=0,totalSecs=0,rejectedSecs=0;
if(data){data.forEach(v=>{const o=parseFloat(v.duration_seconds||0);totalSecs+=o;if(v.status==='QUALIFIED')approvedSecs+=parseFloat(v.approved_duration_seconds||0);else if(v.status==='UNCHECKED')waitingSecs+=o;else if(v.status==='REJECTED')rejectedSecs+=o;});}
const realMoney=approvedSecs*RATE_PER_SECOND,waitingMoney=0;
document.getElementById('myHoursText').innerHTML=`
<div style="font-size:13px;margin-bottom:6px">Total: <b>${Math.floor(totalSecs)}s = ₦${(totalSecs*RATE_PER_SECOND).toFixed(2)}</b></div>
<div style="font-size:13px;margin-bottom:6px;color:#f1c40f">⏳ Waiting: <b>${Math.floor(waitingSecs)}s = ₦0.00 (pending)</b></div>
<div style="font-size:28px;font-weight:900;color:#2ed573;margin:8px 0">₦${realMoney.toFixed(2)}</div>
<div style="font-size:12px">✅ Approved: ${Math.floor(approvedSecs)}s / ${TARGET_SECONDS}s | ❌ Rejected: ${Math.floor(rejectedSecs)}s</div>
<div style="background:rgba(0,0,0,0.3);border-radius:10px;height:12px;margin:10px 0"><div style="background:linear-gradient(90deg,#2ed573,#f1c40f);height:100%;width:${Math.min(100,(approvedSecs/TARGET_SECONDS)*100)}%;border-radius:10px"></div></div>
`;
}
loadMyHours();showAnnouncement();
</script>
</body>
</html>
