<!-- ADD THIS FOR USER TO SEE APPROVED HOURS - CHAIRMAN FEATURE -->
<div id="myHoursCard" style="background:linear-gradient(135deg,#667eea,#764ba2);padding:14px;border-radius:14px;margin:12px 0;color:#fff;border:2px solid yellow;display:none">
<h4 style="text-align:center">⏱️ My Approved Hours</h4>
<p id="myHoursText" style="text-align:center;font-size:14px;margin:8px 0">Calculating...</p>
<div id="myHoursBreakdown" style="font-size:12px"></div>
</div>
<script>
async function loadMyHours(){
  let myName = localStorage.getItem('pidgin_user_name') || localStorage.getItem('user_name') || ''; 
  if(!myName) return;
  let {data} = await sb.from('voices').select('*').eq('name', myName).limit(200);
  // If your table use user_name instead of name, change above
  if(!data || !data.length){
    // try user_name column
    let r2 = await sb.from('voices').select('*').eq('user_name', myName).limit(200);
    data = r2.data;
  }
  if(!data || !data.length) return;
  let raw=0, audited=0, approved=0, good=0, broken=0;
  data.forEach(v=>{
    let d=parseFloat(v.duration_seconds||v.duration||0)||0; raw+=d;
    let a=v.approved_duration_seconds!=null?parseFloat(v.approved_duration_seconds):0; audited+=a;
    if(v.status==='GOOD') good++; if(v.status==='BROKEN') broken++;
    if(v.status==='GOOD' && v.approved_duration_seconds!=null) approved+=a;
  });
  document.getElementById('myHoursCard').style.display='block';
  document.getElementById('myHoursText').innerHTML=`
    Raw: <b>${(raw/60).toFixed(1)} mins</b> (${(raw/3600).toFixed(2)}h) <br>
    Audited (After Auto-Check): <b style="color:#feca57">${(audited/60).toFixed(1)} mins</b> (${(audited/3600).toFixed(2)}h) <br>
    <span style="background:#2ed573;color:#000;padding:4px 8px;border-radius:6px;font-weight:bold">✅ Approved: ${(audited/60).toFixed(1)} mins = ${(audited/3600).toFixed(2)}h</span><br>
    <small>Good: ${good} | Broken removed: ${broken} | Loss: ${((raw-audited)/60).toFixed(1)} mins</small>
  `;
  document.getElementById('myHoursBreakdown').innerHTML=data.slice(0,5).map(v=>`<div style="background:rgba(0,0,0,.3);padding:6px;border-radius:6px;margin:4px 0;display:flex;justify-content:space-between"><span>${(v.duration_seconds||0)}s → ${v.approved_duration_seconds||0}s</span><span style="background:${v.status==='GOOD'?'#2ed573':'#ff4757'};padding:2px 6px;border-radius:4px;font-size:10px">${v.status||'PENDING'}</span></div>`).join('');
}
loadMyHours();
</script>
