<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ademi Pidgin Voice - 2 Mins Min</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0f0c29;color:#fff;padding:12px}
.card{background:rgba(255,255,255,.1);border-radius:14px;padding:14px;margin:12px 0;border:1px solid rgba(255,255,255,.15)}
.btn{padding:14px;border-radius:12px;border:none;font-weight:900;width:100%;margin:6px 0;font-size:16px;cursor:pointer}
input,textarea,select{width:100%;padding:12px;border-radius:10px;background:rgba(0,0,0,.4);color:#fff;border:1px solid #555;margin:6px 0}
</style>
</head>
<body>
<h2 style="text-align:center">🎙️ Ademi Pidgin Voice</h2>
<p style="text-align:center;font-size:11px;opacity:.7">Min 2 Minutes • Anti-Scam • Silence Removed</p>

<div id="myHoursCard" style="background:linear-gradient(135deg,#667eea,#764ba2);padding:14px;border-radius:14px;margin:12px 0;color:#fff;border:2px solid yellow;display:none"><h4 style="text-align:center">⏱️ My Hours</h4><p id="myHoursText" style="text-align:center;font-size:14px;margin:8px 0"></p></div>

<div class="card">
<input id="userName" placeholder="Your name e.g Adiam" oninput="localStorage.setItem('pidgin_user_name',this.value)">
<select id="vLoc"><option>Port Harcourt</option><option>Lagos</option><option>Abuja</option><option>Warri</option><option>Other</option></select>
<textarea id="vTranscript" rows="3" placeholder="Talk Pidgin minimum 2 minutes..." readonly style="background:rgba(255,255,0,.1)"></textarea>
<p id="recStatus" style="font-size:13px;margin:8px 0;color:#2ed573;font-weight:bold;background:rgba(0,0,0,.3);padding:8px;border-radius:8px">✅ Ready - Must talk at least 2 MINUTES!</p>
<button class="btn" id="recBtn" style="background:#ff4757;color:#fff" onclick="toggleRec()">🔴 START RECORDING</button>
<p style="font-size:11px;opacity:.6;text-align:center">You must talk 2 mins straight, silence go comot automatically</p>
</div>

<div class="card"><h4>🎧 My Voices — Must be 2 mins to get GREEN</h4><div id="myVoices">Loading...</div></div>
<div class="card" style="text-align:center"><button class="btn" style="background:rgba(255,255,255,.15)" onclick="location.href='ademi.html'">👑 Chairman Panel</button></div>

<script>
const SUPA_URL="https://rupuxvpupdhlhxgjrbsh.supabase.co";const SUPA_KEY="sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY";const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let mediaRec,chunks=[],audioBlob,startTime,recognition,finalTranscript='',autoSaveTimer,audioContext,analyser,speakingTime=0,lastCheck=0;
const MIN_SECONDS = 120; // 2 MINUTES - change to 180 if you want 3 minutes
document.getElementById('userName').value=localStorage.getItem('pidgin_user_name')||'';

function setupSpeech(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
 let rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang='en-NG';
 rec.onresult=(e)=>{let inter=''; for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal) finalTranscript+=e.results[i][0].transcript+' '; else inter+=e.results[i][0].transcript;} document.getElementById('vTranscript').value=finalTranscript+inter;};
 return rec;
}

function checkScam(transcript, talkingTime, totalTime){
 let t = (transcript||'').toLowerCase().trim();
 let words = t.split(/\s+/).filter(w=>w.length>0);

 // RULE 1: Must reach 2 minutes talking time
 if(talkingTime < MIN_SECONDS){
   return {ok:false, reason:`Too short! You talk only ${Math.round(talkingTime)}s (${(talkingTime/60).toFixed(1)} mins) — Need at least ${MIN_SECONDS/60} mins (2 mins). Talk more!`};
 }
 // RULE 2: No nonsense repeat
 if(t && /(.)\1{5,}/.test(t)) return {ok:false, reason:`Nonsense "aaaa" detected — talk real Pidgin`};
 if(words.length>=5){
   let counts={}; words.forEach(w=>counts[w]=(counts[w]||0)+1);
   let maxRepeat = Math.max(...Object.values(counts));
   if(maxRepeat/words.length > 0.6) return {ok:false, reason:`Same word repeated x${maxRepeat} — talk different words`};
 }
 // RULE 3: If transcript exists, check small pidgin. If transcript empty but talkingTime is 2 mins, allow it (network issue)
 if(t.length>10){
   let pidginWords = ['na','dey','abi','oga','abeg','una','wey','sabi','waka','how far','no be','i dey','you dey'];
   let hasPidgin = pidginWords.some(p=>t.includes(p));
   if(!hasPidgin && words.length<15) return {ok:false, reason:`No Pidgin word in "${t.slice(0,40)}" — must be Pidgin`};
 }
 return {ok:true, reason:`Good! ${Math.round(talkingTime)}s talking`};
}

async function toggleRec(){
 if(mediaRec && mediaRec.state==='recording'){
   mediaRec.stop(); if(recognition) try{recognition.stop();}catch(e){} if(audioContext) try{audioContext.close();}catch(e){}
   document.getElementById('recBtn').innerText='⏳ Checking...';
   let total=(Date.now()-startTime)/1000; let silent=total-speakingTime;
   document.getElementById('recStatus').innerHTML=`Total ${total.toFixed(1)}s - Talk ${speakingTime.toFixed(1)}s - Checking 2 mins rule...`;
   clearTimeout(autoSaveTimer); autoSaveTimer=setTimeout(()=>autoSaveVoice(total,speakingTime,silent),1000); return;
 }
 finalTranscript=''; document.getElementById('vTranscript').value=''; audioBlob=null; speakingTime=0;
 recognition=setupSpeech();
 try{
   let s=await navigator.mediaDevices.getUserMedia({audio:true});
   audioContext=new(window.AudioContext||window.webkitAudioContext)(); let src=audioContext.createMediaStreamSource(s); analyser=audioContext.createAnalyser(); analyser.fftSize=512; src.connect(analyser);
   let data=new Uint8Array(analyser.frequencyBinCount); lastCheck=Date.now();
   function checkVoice(){
     if(!mediaRec||mediaRec.state!=='recording') return;
     analyser.getByteFrequencyData(data); let sum=0; for(let i=0;i<data.length;i++) sum+=data[i]; let avg=sum/data.length;
     let talking=avg>8; // More sensitive - was 15, now 8 so it hears you!
     if(talking){speakingTime+=(Date.now()-lastCheck)/1000;}
     let mins = speakingTime/60;
     let need = MIN_SECONDS/60;
     if(talking) document.getElementById('recStatus').innerHTML=`🔴 TALKING ${speakingTime.toFixed(0)}s / ${MIN_SECONDS}s (${mins.toFixed(1)}/${need} mins) Vol ${avg.toFixed(0)} — ${speakingTime>=MIN_SECONDS?'✅ Reach 2 mins! You can STOP':'Keep talking...'}`;
     else document.getElementById('recStatus').innerHTML=`🤫 Quiet ${speakingTime.toFixed(0)}s / ${MIN_SECONDS}s — Talk loud!`;
     lastCheck=Date.now(); requestAnimationFrame(checkVoice);
   }
   mediaRec=new MediaRecorder(s); chunks=[]; startTime=Date.now(); mediaRec.ondataavailable=e=>chunks.push(e.data); mediaRec.onstop=()=>{audioBlob=new Blob(chunks,{type:'audio/webm'});}; mediaRec.start(); if(recognition) try{recognition.start();}catch(e){} checkVoice();
   document.getElementById('recStatus').innerText='🔴 Recording... Must reach 2 MINUTES!'; document.getElementById('recBtn').innerText='⏹️ STOP (when reach 2 mins)'; document.getElementById('recBtn').style.background='#ffa502';
 }catch(e){alert('Allow mic! '+e.message);}
}

async function autoSaveVoice(total, talking, silent){
 let name=document.getElementById('userName').value.trim(); if(!name){name=prompt('Your name?')||'Anon'; document.getElementById('userName').value=name; localStorage.setItem('pidgin_user_name',name);}
 if(!audioBlob){resetBtn(); return;}
 let transcript=document.getElementById('vTranscript').value.trim();
 let scamCheck = checkScam(transcript, talking, total);
 let approved, status, note, qual;
 if(!scamCheck.ok){
   approved=0; status='BROKEN'; qual=0; note=`❌ REJECTED: ${scamCheck.reason} | Total ${total.toFixed(1)}s Talk ${talking.toFixed(1)}s | 0h`;
   document.getElementById('recStatus').innerHTML=`❌ REJECTED! ${scamCheck.reason}<br>0 hours`;
 } else {
   approved=talking; status='GOOD'; qual=90; note=`✅ APPROVED: ${scamCheck.reason} | Total ${total.toFixed(1)}s Talk ${talking.toFixed(1)}s Silent ${silent.toFixed(1)}s removed → Approved ${approved.toFixed(1)}s = ${(approved/3600).toFixed(3)}h`;
   document.getElementById('recStatus').innerHTML=`✅ APPROVED! Talk ${talking.toFixed(0)}s (${(talking/60).toFixed(1)} mins) → Saved!`;
 }
 try{
   let fileName=`${Date.now()}_${name}.webm`; await sb.storage.from('voices').upload(fileName,audioBlob);
   let {data:urlData}=sb.storage.from('voices').getPublicUrl(fileName);
   await sb.from('voices').insert([{name:name,user_name:name,title:`Voice ${new Date().toLocaleTimeString()} - ${talking>=MIN_SECONDS?'GOOD':'SHORT'}`,transcript:transcript||'(No transcript but audio '+talking.toFixed(0)+'s)',location:document.getElementById('vLoc').value,duration_seconds:total,approved_duration_seconds:approved,audio_url:urlData.publicUrl,quality_score:qual,status:status,inspector_note:note}]);
   resetBtn(); loadMyVoices(); loadMyHours();
 }catch(e){alert('Save failed: '+e.message); resetBtn();}
}
function resetBtn(){document.getElementById('recBtn').innerText='🔴 START RECORDING'; document.getElementById('recBtn').style.background='#ff4757';}
async function loadMyVoices(){
 let myName=localStorage.getItem('pidgin_user_name')||''; if(!myName){document.getElementById('myVoices').innerHTML='Enter name';return;}
 let {data}=await sb.from('voices').select('*').eq('name',myName).order('created_at',{ascending:false}).limit(50);
 if(!data||!data.length){let r2=await sb.from('voices').select('*').eq('user_name',myName).order('created_at',{ascending:false}).limit(50); data=r2.data;}
 if(!data||!data.length){document.getElementById('myVoices').innerHTML='No voices yet — talk 2 mins!';return;}
 document.getElementById('myVoices').innerHTML=data.map(v=>{
   let col=v.status==='GOOD'?'#2ed573':'#ff4757';
   return `<div style="background:rgba(0,0,0,.35);padding:10px;border-radius:10px;margin:8px 0;border-left:5px solid ${col}"><b>${v.title}</b> <span style="background:${col};color:#000;padding:2px 6px;border-radius:5px;font-size:10px">${v.status}</span><br><b>Raw ${parseFloat(v.duration_seconds||0).toFixed(0)}s → Approved ${v.approved_duration_seconds!=null?parseFloat(v.approved_duration_seconds).toFixed(0)+'s':'0s'} = ${(parseFloat(v.approved_duration_seconds||0)/60).toFixed(1)} mins</b><br><small>${v.inspector_note||''}</small><br><audio controls src="${v.audio_url}" style="width:100%;height:28px;margin-top:4px"></audio></div>`;
 }).join('');
}
async function loadMyHours(){
 let myName=localStorage.getItem('pidgin_user_name')||''; if(!myName) return;
 let {data}=await sb.from('voices').select('*').eq('name',myName).limit(200); if(!data||!data.length){let r2=await sb.from('voices').select('*').eq('user_name',myName).limit(200); data=r2.data;} if(!data||!data.length) return;
 let raw=0,approved=0,good=0,bad=0; data.forEach(v=>{raw+=parseFloat(v.duration_seconds||0)||0; approved+=parseFloat(v.approved_duration_seconds||0)||0; if(v.status==='GOOD') good++; else bad++;});
 document.getElementById('myHoursCard').style.display='block';
 document.getElementById('myHoursText').innerHTML=`Raw: <b>${(raw/60).toFixed(1)}m</b> | Approved: <b style="color:#2ed573">${(approved/60).toFixed(1)}m</b> | Rejected: <b style="color:#ff4757">${bad}</b><br><span style="background:#2ed573;color:#000;padding:6px 12px;border-radius:8px;font-weight:900;display:inline-block;margin:6px 0">✅ REAL HOURS: ${(approved/60).toFixed(1)}m = ${(approved/3600).toFixed(3)}h</span><br><small>Good: ${good} | Rejected: ${bad} — Need 2 mins per voice</small>`;
}
loadMyVoices();loadMyHours();
</script>
</body>
</html>
