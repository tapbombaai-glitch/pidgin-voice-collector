<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ademi Pidgin Voice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #17202a;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #087f5b;
      color: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd6d1;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      padding: 13px 18px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    .start {
      background: #087f5b;
      color: white;
    }

    .stop {
      background: #e7eee9;
      color: #123b2e;
    }

    .submit {
      width: 100%;
      background: #087f5b;
      color: white;
      margin-top: 15px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .timer {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    .status {
      padding: 13px;
      background: #eef4f1;
      border-radius: 10px;
      margin-top: 15px;
      white-space: pre-wrap;
    }

    .announcement {
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Ademi Pidgin Voice</h1>
    <p>
      Record your Naija Pidgin English voice and submit am.
      Speak clearly and naturally.
    </p>
  </div>

  <div class="card">
    <h2>Announcement</h2>
    <div id="announcement" class="announcement">
      Loading announcement...
    </div>
  </div>

  <div class="card">

    <h2>Your Details</h2>

    <form id="recordForm">

      <label>Your Name</label>
      <input
        id="name"
        type="text"
        required
        placeholder="Enter your name"
      >

      <label>Account Name</label>
      <input
        id="accountName"
        type="text"
        required
        placeholder="Bank account name"
      >

      <label>Account Number</label>
      <input
        id="accountNumber"
        type="text"
        inputmode="numeric"
        maxlength="10"
        required
        placeholder="10 digit account number"
      >

      <label>Bank Name</label>
      <input
        id="bankName"
        type="text"
        required
        placeholder="Your bank name"
      >

      <label>Location</label>
      <input
        id="location"
        type="text"
        placeholder="Your town/state"
      >

      <label>Recording Title</label>
      <input
        id="title"
        type="text"
        placeholder="Example: Market conversation"
      >

      <div class="timer">
        Recording: <span id="timer">00:00</span>
      </div>

      <div style="text-align:center">

        <button
          type="button"
          class="start"
          id="startButton"
        >
          🎙️ Start Recording
        </button>

        <button
          type="button"
          class="stop"
          id="stopButton"
          disabled
        >
          ⏹ Stop Recording
        </button>

      </div>

      <div class="status" id="status">
        Ready. Tap Start Recording when you are ready.
      </div>

      <button
        type="submit"
        class="submit"
        id="submitButton"
        disabled
      >
        Submit Recording
      </button>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://rupuxvpupdhlhxgjrbsh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hp";

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const BUCKET = "voices";

let recorder = null;
let stream = null;
let chunks = [];
let audioBlob = null;
let recordingStart = 0;
let timerInterval = null;
let recordingSeconds = 0;


/* ---------------------------
   ELEMENTS
---------------------------- */

const startButton =
document.getElementById("startButton");

const stopButton =
document.getElementById("stopButton");

const submitButton =
document.getElementById("submitButton");

const timer =
document.getElementById("timer");

const status =
document.getElementById("status");


/* ---------------------------
   TIMER
---------------------------- */

function formatTime(seconds) {

  seconds = Math.floor(seconds);

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return String(minutes).padStart(2, "0")
    + ":"
    + String(secs).padStart(2, "0");
}


function startTimer() {

  recordingStart = Date.now();

  timerInterval =
    setInterval(() => {

      recordingSeconds =
        (Date.now() - recordingStart) / 1000;

      timer.textContent =
        formatTime(recordingSeconds);

    }, 250);
}


function stopTimer() {

  clearInterval(timerInterval);

  timerInterval = null;
}


/* ---------------------------
   ANNOUNCEMENT
---------------------------- */

async function loadAnnouncement() {

  const box =
    document.getElementById("announcement");

  const { data, error } =
    await supabase
      .from("announcements")
      .select("*")
      .order("created_at", {
        ascending: false
      })
      .limit(1);

  if (error) {

    box.textContent =
      "No announcement available.";

    return;
  }

  if (!data || data.length === 0) {

    box.textContent =
      "No new announcement.";

    return;
  }

  const announcement = data[0];

  box.textContent =
    announcement.message ||
    announcement.content ||
    announcement.title ||
    "No announcement.";

}


/* ---------------------------
   START RECORDING
---------------------------- */

startButton.addEventListener(
  "click",
  async () => {

    try {

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {

        throw new Error(
          "Your browser no support microphone recording."
        );

      }

      stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });


      chunks = [];

      audioBlob = null;


      let mimeType =
        "audio/webm";


      if (
        MediaRecorder.isTypeSupported(
          "audio/webm;codecs=opus"
        )
      ) {

        mimeType =
          "audio/webm;codecs=opus";

      }


      recorder =
        new MediaRecorder(
          stream,
          {
            mimeType: mimeType
          }
        );


      recorder.ondataavailable =
        event => {

          if (event.data &&
              event.data.size > 0) {

            chunks.push(event.data);

          }

        };


      recorder.onstop =
        () => {

          audioBlob =
            new Blob(
              chunks,
              {
                type:
                  recorder.mimeType ||
                  "audio/webm"
              }
            );


          stopTimer();


          recordingSeconds =
            (Date.now() - recordingStart) / 1000;


          timer.textContent =
            formatTime(recordingSeconds);


          if (audioBlob.size > 0) {

            submitButton.disabled =
              false;

            status.textContent =
              "Recording ready. Tap Submit Recording.";

          }


          if (stream) {

            stream
              .getTracks()
              .forEach(track =>
                track.stop()
              );

          }

        };


      recorder.start(1000);


      startButton.disabled = true;

      stopButton.disabled = false;

      submitButton.disabled = true;


      startTimer();


      status.textContent =
        "Recording dey go on... Speak clearly.";

    }

    catch (error) {

      status.textContent =
        "Microphone error: "
        + error.message;

    }

  }
);


/* ---------------------------
   STOP RECORDING
---------------------------- */

stopButton.addEventListener(
  "click",
  () => {

    if (
      recorder &&
      recorder.state !== "inactive"
    ) {

      recorder.stop();

    }

    startButton.disabled = false;

    stopButton.disabled = true;

  }
);


/* ---------------------------
   SUBMIT RECORDING
---------------------------- */

document
.getElementById("recordForm")
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if (!audioBlob) {

      status.textContent =
        "Please record your voice first.";

      return;

    }


    const name =
      document
      .getElementById("name")
      .value
      .trim();


    const accountName =
      document
      .getElementById("accountName")
      .value
      .trim();


    const accountNumber =
      document
      .getElementById("accountNumber")
      .value
      .trim();


    const bankName =
      document
      .getElementById("bankName")
      .value
      .trim();


    const location =
      document
      .getElementById("location")
      .value
      .trim();


    const title =
      document
      .getElementById("title")
      .value
      .trim();


    if (
      !name ||
      !accountName ||
      !bankName ||
      !/^\d{10}$/.test(accountNumber)
    ) {

      status.textContent =
        "Please check your details. Account number must be 10 digits.";

      return;

    }


    submitButton.disabled = true;

    status.textContent =
      "Uploading your recording... Please wait.";


    try {

      const extension =
        audioBlob.type.includes("mp4")
          ? "m4a"
          : "webm";


      const fileName =
        crypto.randomUUID()
        + "."
        + extension;


      /* UPLOAD AUDIO */

      const upload =
        await supabase
          .storage
          .from(BUCKET)
          .upload(
            fileName,
            audioBlob,
            {
              contentType:
                audioBlob.type ||
                "audio/webm",

              upsert: false
            }
          );


      if (upload.error) {

        throw upload.error;

      }


      /* GET PUBLIC URL */

      const publicUrl =
        supabase
          .storage
          .from(BUCKET)
          .getPublicUrl(fileName);


      const audioUrl =
        publicUrl.data.publicUrl;


      /* SAVE RECORD */

      const { error } =
        await supabase
          .from("voices")
          .insert({

            admin_name: name,

            audio_url: audioUrl,

            created_at:
              new Date().toISOString(),

            duration:
              Math.round(recordingSeconds),

            location:
              location || null,

            status:
              "UNCHECKED",

            account_name:
              accountName,

            account_number:
              accountNumber,

            bank_name:
              bankName,

            bank_account:
              accountNumber,

            bio:
              title || null

          });


      if (error) {

        throw error;

      }


      /* SUCCESS */

      status.textContent =
        "✅ Recording submitted successfully!\n\nThank you for contributing your Naija Pidgin voice.";

      audioBlob = null;

      chunks = [];

      timer.textContent = "00:00";

      document
        .getElementById("recordForm")
        .reset();

      submitButton.disabled = true;

    }

    catch (error) {

      status.textContent =
        "❌ Submission failed:\n"
        + error.message;

      submitButton.disabled = false;

    }

  }
);


/* LOAD ANNOUNCEMENT */

loadAnnouncement();

</script>

</body>
</html>
