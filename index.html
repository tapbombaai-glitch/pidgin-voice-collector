<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ademi Pidgin Voice - Academic</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0c29; color: #fff; padding: 16px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
  h1 { text-align: center; font-size: 22px; margin: 10px 0 4px; }
.subtitle { text-align: center; font-size: 13px; opacity: 0.7; margin-bottom: 18px; }
.card { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.12); }
  input, select, textarea { width: 100%; padding: 14px; border-radius: 12px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid #555; font-size: 16px; margin-bottom: 12px; }
  textarea { min-height: 80px; resize: none; }
.btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 8px; }
.btn-red { background: #ff4757; color: white; }
.btn-orange { background: #ffa502; color: #000; }
.status-box { background: rgba(0,0,0,0.35); border-radius: 12px; padding: 14px; text-align: center; font-size: 15px; font-weight: 600; margin: 12px 0; line-height: 1.4; }
.progress-container { background: rgba(0,0,0,0.4); border-radius: 20px; height: 18px; margin: 12px 0; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573); width: 0%; transition: width 0.3s ease; border-radius: 20px; }
.hours-card { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px; padding: 16px; text-align: center; border: 2px solid #f1c40f; margin-bottom: 16px; }
.voice-item { background: rgba(0,0,0,0.35); border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 5px solid #555; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-left: 6px; }
.earn { color: #f1c40f; font-weight: 900; }
.small { font-size: 12px; opacity: 0.75; margin-top: 6px; }
.section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: #f1c40f; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<h1>🎙️ Ademi Pidgin Voice</h1>
<p class="subtitle">Talk minimum 2 minutes • Real Pidgin only • ₦500 per 90 mins</p>
<div id="announceBox" style="display:none;background:linear-gradient(135deg,#f1c40f,#ff9a00);border:2px solid #fff;border-radius:12px;padding:14px;margin-bottom:16px;text-align:center;font-weight:900;color:#000;animation:pulse 2s infinite">📢 Loading announcement...</div>
<div class="hours-card"><h3 style="margin-bottom: 8px;">💰 My Balance (Chairman Approved Only)</h3><div id="myHoursText">Loading...</div></div>
<div class="card">
  <div class="section-title">🏦 Your Bank Details (Compulsory)</div>
  <input id="accountName" placeholder="Account Name" maxlength="60">
  <input id="accountNumber" placeholder="Account Number" maxlength="15" inputmode="numeric">
  <input id="bankName" placeholder="Bank Name (e.g. Opay, GTBank, Palmpay)" maxlength="40">
</div>
<div class="card">
  <input id="userName" placeholder="Your name" maxlength="40">
  <select id="vLoc"><option>Port Harcourt</option><option>Lagos</option><option>Abuja</option><option>Warri</option><option>Other</option></select>
  <textarea id="vTranscript" placeholder="Your Pidgin will appear here while you talk..." readonly></textarea>
  <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
  <div style="text-align: center; font-size: 14px; margin-bottom: 8px;" id="progressText">0 / 120 seconds</div>
  <div class="status-box" id="recStatus">✅ Ready<br><span class="small">Talk 2 minutes, you qualify to save</span></div>
  <button class="btn btn-red" id="recBtn" onclick="toggleRec()">🔴 START RECORDING</button>
</div>
<div class="card"><h3 style="margin-bottom: 12px;">📊 My Records Summary</h3><div id="myVoices">Loading...</div></div>

<script>
const SUPA_URL = "https://rupuxvpupdhlhxgjrbsh.supabase.co";
const SUPA_KEY = "sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const MIN_SECONDS = 120;
const TARGET_SECONDS = 5400;
const TARGET_PAY = 500;
const RATE_PER_SECOND = TARGET_PAY / TARGET_SECONDS;
let mediaRec = null; let chunks = []; let audioBlob = null; let recognition = null; let finalTranscript = ''; let speakingTime = 0; let lastCheck = 0; let audioContext = null; let analyser = null; let isRecording = false;

document.getElementById('userName').value = localStorage.getItem('pidgin_user_name') || '';
document.getElementById('accountName').value = localStorage.getItem('pidgin_account_name') || '';
document.getElementById('accountNumber').value = localStorage.getItem('pidgin_account_number') || '';
document.getElementById('bankName').value = localStorage.getItem('pidgin_bank_name') || '';

function setupSpeech(){ const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return null; const rec = new SR(); rec.continuous=true; rec.interimResults=true; rec.lang='en-NG'; rec.onresult = (e)=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal){ finalTranscript+=e.results[i][0].transcript+' '; }else{ interim+=e.results[i][0].transcript; } } document.getElementById('vTranscript').value = finalTranscript + interim; }; return rec; }
function updateProgress(){ const percent=Math.min((speakingTime/MIN_SECONDS)*100,100); document.getElementById('progressBar').style.width=percent+'%'; document.getElementById('progressText').innerText=`${Math.floor(speakingTime)} / ${MIN_SECONDS} secs`; }
async function showAnnouncement(){ try{ const {data} = await sb.from('announcements').select('*').order('created_at',{ascending:false}).limit(1); if(data && data[0] && data[0].message){ const box = document.getElementById('announceBox'); box.style.display='block'; box.innerHTML='📢 CHAIRMAN: <span style="font-size:15px;">'+data[0].message+'</span>'; } }catch(e){} }
async function toggleRec(){
  if(isRecording){ isRecording=false; document.getElementById('recBtn').innerText='⏳ Saving...'; document.getElementById('recBtn').disabled=true; if(mediaRec && mediaRec.state!=='inactive'){ mediaRec.onstop = async ()=>{ if(chunks.length>0){ audioBlob = new Blob(chunks, {type:'audio/webm'}); await processRecording(); } else { alert("No audio"); resetUI(); } }; mediaRec.stop(); } if(recognition) try{recognition.stop();}catch(e){} if(audioContext) try{audioContext.close();}catch(e){} return; }
  const name=document.getElementById('userName').value.trim(); const accName=document.getElementById('accountName').value.trim(); const accNumber=document.getElementById('accountNumber').value.trim(); const bank=document.getElementById('bankName').value.trim();
  if(!name){ alert('Please enter your name'); return; } if(!accName||!accNumber||!bank){ alert('Fill bank details'); return; }
  localStorage.setItem('pidgin_user_name',name); localStorage.setItem('pidgin_account_name',accName); localStorage.setItem('pidgin_account_number',accNumber); localStorage.setItem('pidgin_bank_name',bank);
  finalTranscript=''; document.getElementById('vTranscript').value=''; speakingTime=0; chunks=[]; audioBlob=null; updateProgress();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true}); audioContext=new (window.AudioContext||window.webkitAudioContext)(); const source=audioContext.createMediaStreamSource(stream); analyser=audioContext.createAnalyser(); analyser.fftSize=512; source.connect(analyser); const data=new Uint8Array(analyser.frequencyBinCount); lastCheck=Date.now();
    function checkVoice(){ if(!isRecording) return; analyser.getByteFrequencyData(data); let sum=0; for(let i=0;i<data.length;i++) sum+=data[i]; const avg=sum/data.length; const talking=avg>8; const now=Date.now(); const delta=(now-lastCheck)/1000; if(talking) speakingTime+=delta; else speakingTime+=delta*0.3; lastCheck=now; updateProgress(); const remaining=Math.max(0,MIN_SECONDS-speakingTime); if(speakingTime>=MIN_SECONDS){ document.getElementById('recStatus').innerHTML=`✅ You don reach 2 mins! You fit stop now<br><span class="small">Wait for Chairman to approve money</span>`; }else{ document.getElementById('recStatus').innerHTML=`🔴 Talking... ${Math.floor(speakingTime)}s<br><span class="small">${Math.ceil(remaining)} secs left</span>`; } requestAnimationFrame(checkVoice); }
    mediaRec=new MediaRecorder(stream); mediaRec.ondataavailable=e=>{ if(e.data && e.data.size>0) chunks.push(e.data); }; mediaRec.start(200); recognition=setupSpeech(); if(recognition) try{recognition.start();}catch(e){} isRecording=true; checkVoice(); document.getElementById('recBtn').innerText='⏹️ STOP RECORDING'; document.getElementById('recBtn').className='btn btn-orange';
  }catch(err){ alert('Allow mic: '+err.message); resetUI(); }
}
async function processRecording(){
  const name=document.getElementById('userName').value.trim()||'Anon'; const transcript=document.getElementById('vTranscript').value.trim(); const location=document.getElementById('vLoc').value; const accName=document.getElementById('accountName').value.trim(); const accNumber=document.getElementById('accountNumber').value.trim(); const bank=document.getElementById('bankName').value.trim();
  if(!audioBlob && chunks.length>0){ audioBlob = new Blob(chunks, {type:'audio/webm'}); } if(!audioBlob || audioBlob.size < 500){ document.getElementById('recStatus').innerHTML=`❌ No audio`; resetUI(); return; } if(speakingTime < MIN_SECONDS){ document.getElementById('recStatus').innerHTML=`❌ Only ${Math.round(speakingTime)} secs`; resetUI(); return; }
  document.getElementById('recStatus').innerHTML=`✅ Your ${Math.round(speakingTime)}s don save!<br><div style="background: rgba(241,196,15,0.25); border: 1px solid #f1c40f; padding: 10px; border-radius: 10px; margin-top: 10px; font-size: 13px; font-weight: 800; color: #f1c40f; text-align: center;">⏳ Waiting for Chairman approval - Real money go show after Chairman confirm am</div>`;
  try{
    const fileName=`${Date.now()}_${name.replace(/\s+/g,'_')}.webm`; const {error:upErr} = await sb.storage.from('voices').upload(fileName, audioBlob, {contentType:'audio/webm'}); if(upErr) throw upErr;
    const {data:urlData} = sb.storage.from('voices').getPublicUrl(fileName);
    await sb.from('voices').insert([{ name:name, user_name:name, title:`${name} - ${(speakingTime/60).toFixed(1)}m`, transcript:transcript||'(Audio)', location:location, duration_seconds:Math.round(speakingTime), approved_duration_seconds:0, audio_url:urlData.publicUrl, quality_score:0, status:'UNCHECKED', inspector_note:'Waiting', account_name:accName, account_number:accNumber, bank_name:bank }]);
    await loadMyVoices(); await loadMyHours();
  }catch(err){ alert('Save failed: '+err.message); }
  resetUI();
}
function resetUI(){ isRecording=false; document.getElementById('recBtn').innerText='🔴 START RECORDING'; document.getElementById('recBtn').className='btn btn-red'; document.getElementById('recBtn').disabled=false; speakingTime=0; updateProgress(); }

// === ACADEMIC LOGIC - MONEY ONLY AFTER APPROVAL ===
async function loadMyVoices(){
  const myName=localStorage.getItem('pidgin_user_name')||''; if(!myName){ document.getElementById('myVoices').innerHTML='<p class="small">Enter name first</p>'; return; }
  let {data} = await sb.from('voices').select('*').eq('name',myName).order('created_at',{ascending:false}).limit(30);
  if(!data||data.length===0){ const r2=await sb.from('voices').select('*').eq('user_name',myName).order('created_at',{ascending:false}).limit(30); data=r2.data; }
  if(!data||data.length===0){ document.getElementById('myVoices').innerHTML='<p class="small">No recordings</p>'; return; }

  let totalRec=0, approved=0, waiting=0, rejected=0;
  data.forEach(v=>{
    const orig=parseFloat(v.duration_seconds||0); totalRec+=orig;
    if(v.status==='QUALIFIED'){ approved+=parseFloat(v.approved_duration_seconds||0); }
    else if(v.status==='UNCHECKED'){ waiting+=orig; }
    else if(v.status==='REJECTED'){ rejected+=orig; }
  });

  document.getElementById('myVoices').innerHTML=`
    <div style="background:rgba(0,0,0,0.35);border-radius:12px;padding:12px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>Total Recorded:</span><b>${Math.floor(totalRec)}s</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:#f1c40f"><span>⏳ Waiting (Chairman never approve):</span><b>${Math.floor(waiting)}s - ₦0</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:#2ed573"><span>✅ Approved (Real Money):</span><b>${Math.floor(approved)}s = ₦${(approved*RATE_PER_SECOND).toFixed(2)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#ff4757"><span>❌ Rejected:</span><b>${Math.floor(rejected)}s</b></div>
      <div style="margin-top:10px;background:#111;padding:8px;border-radius:8px;font-size:10px">If you record 1 hour (3600s) and Chairman approve 45 mins (2700s), your money go change to ₦${(2700*RATE_PER_SECOND).toFixed(2)} - Na approved time dey count</div>
    </div>
  `;
}
async function loadMyHours(){
  const myName=localStorage.getItem('pidgin_user_name')||''; if(!myName){ document.getElementById('myHoursText').innerHTML='Enter name'; return; }
  let {data} = await sb.from('voices').select('*').eq('name',myName).limit(300);
  if(!data||data.length===0){ const r2=await sb.from('voices').select('*').eq('user_name',myName).limit(300); data=r2.data; }
  let approvedSecs=0, waitingSecs=0;
  if(data){ data.forEach(v=>{ if(v.status==='QUALIFIED') approvedSecs+=parseFloat(v.approved_duration_seconds||0); else if(v.status==='UNCHECKED') waitingSecs+=parseFloat(v.duration_seconds||0); }); }
  const realMoney = approvedSecs * RATE_PER_SECOND;
  const percent = Math.min(100, (approvedSecs / TARGET_SECONDS)*100);
  document.getElementById('myHoursText').innerHTML=`
    <div style="font-size:11px;opacity:0.7">WAITING: ${Math.floor(waitingSecs)}s (₦0 until Chairman approve)</div>
    <div style="font-size:26px;font-weight:900;color:#2ed573;margin:6px 0">₦${realMoney.toFixed(2)}</div>
    <div style="font-size:11px">APPROVED: ${Math.floor(approvedSecs)}s / ${TARGET_SECONDS}s (Only approved dey count)</div>
    <div style="background:rgba(0,0,0,0.3);border-radius:10px;height:12px;margin:10px 0"><div style="background:linear-gradient(90deg,#2ed573,#f1c40f);height:100%;width:${percent}%;border-radius:10px"></div></div>
    <div style="font-size:10px">Real money = Approved seconds × rate. If Chairman cut bad parts, money go reduce.</div>
  `;
}
loadMyVoices(); loadMyHours(); showAnnouncement(); setInterval(showAnnouncement,10000);
</script>
</body>
</html>
