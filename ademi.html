<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ademi Panel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0f0c29;color:#fff;padding:10px}.card{background:rgba(255,255,255,.1);border-radius:12px;padding:12px;margin:10px 0}.btn{padding:10px;border-radius:8px;border:none;font-weight:700;width:100%;margin:5px 0}input,textarea{width:100%;padding:10px;border-radius:8px;background:rgba(0,0,0,.3);color:#fff;border:1px solid #555;margin:5px 0}.h{display:none}</style></head><body><h2>👑 Ademi Panel - AI Inspector</h2>
<div id="login" class="card"><input type="password" id="pass" placeholder="Password"><button class="btn" style="background:#feca57" onclick="login()">Enter</button></div>
<div id="main" class="h"><div class="card"><h4>📢 Post Announcement</h4><input id="aT" placeholder="Title"><textarea id="aM" placeholder="Message"></textarea><button class="btn" style="background:#feca57;color:#000" onclick="postA()">Post</button><div id="aList"></div></div>
<div class="card"><h4>🤖 AI Inspector - Auto Sorted</h4><div style="display:flex;gap:5px"><button class="btn" style="background:#fff;color:#000" onclick="filterA('all')">All</button><button class="btn" style="background:#2ed573" onclick="filterA('good')">🟢 Good</button><button class="btn" style="background:#ff4757" onclick="filterA('bad')">🔴 Bad</button></div><div id="listA">Loading...</div></div></div>
<script>
const sb=supabase.createClient("https://rupuxvpupdhlhxgjrbsh.supabase.co","sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY");
function login(){if(document.getElementById('pass').value==='Ademi@2026Secure!'){document.getElementById('login').classList.add('h');document.getElementById('main').classList.remove('h');load();loadA()}else alert('Wrong')}
async function load(){let {data}=await sb.from('voices').select('*').order('quality_score',{ascending:false}).limit(200);document.getElementById('listA').innerHTML=data.map(v=>{let c=v.quality_score>=75?'#2ed573':v.quality_score>=45?'#ffa502':'#ff4757';return `<div class="vItem" data-sc="${v.quality_score||0}" style="border-left:4px solid ${c};background:rgba(0,0,0,.2);padding:8px;margin:6px 0;border-radius:8px;font-size:12px"><b>${v.name}</b> ${v.quality_score||0}% - ${v.ai_verdict||''}<br>${v.transcript}<br><audio controls src="${v.audio_url}" style="width:100%;height:26px"></audio><br><button onclick="delV('${v.id}')" style="background:#ff4757;color:#fff;border:none;padding:4px 8px;border-radius:4px;margin-top:4px">Delete</button></div>`}).join('')}
async function loadA(){let {data}=await sb.from('announcements').select('*').order('created_at',{ascending:false});document.getElementById('aList').innerHTML=(data||[]).map(a=>`${a.title} <button onclick="delA('${a.id}')">X</button><br>`).join('')}
async function postA(){let t=document.getElementById('aT').value;let m=document.getElementById('aM').value;if(!t||!m)return alert('Fill');await sb.from('announcements').insert([{title:t,message:m}]);alert('Posted');loadA()}
async function delA(id){await sb.from('announcements').delete().eq('id',id);loadA()}
async function delV(id){if(!confirm('Delete?'))return;await sb.from('voices').delete().eq('id',id);load()}
function filterA(t){document.querySelectorAll('.vItem').forEach(e=>{let s=parseInt(e.dataset.sc);if(t==='all')e.style.display='block';else if(t==='good')e.style.display=s>=60?'block':'none';else e.style.display=s<60?'block':'none'})}
</script></body></html>
