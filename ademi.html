<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chairman Admin - Ademi</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0f0c29;color:#fff;padding:12px;max-width:520px;margin:auto}
.card{background:rgba(255,255,255,0.08);border-radius:12px;padding:10px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.12)}
.btn{padding:10px 14px;border-radius:8px;border:none;font-weight:800;cursor:pointer;font-size:13px}
.btn-green{background:#2ed573;color:#000}
.btn-red{background:#ff4757;color:#fff}
.btn-yellow{background:#f1c40f;color:#000}
.top{background:linear-gradient(135deg,#667eea,#764ba2);padding:14px;border-radius:12px;text-align:center;margin-bottom:12px;border:2px solid #f1c40f}
.playBtn{background:#3b82f6;color:#fff;padding:6px 12px;border-radius:20px;border:none;font-size:12px}
</style>
</head>
<body>
<div class="top">
<h3>Chairman Dashboard</h3>
<div id="stats" style="margin-top:8px;font-size:13px">Loading...</div>
<div style="margin-top:8px">
<button class="btn btn-yellow" onclick="filter='all';load()">All</button>
<button class="btn btn-yellow" onclick="filter='UNCHECKED';load()">Waiting</button>
<button class="btn btn-green" onclick="filter='QUALIFIED';load()">Good</button>
<button class="btn btn-red" onclick="filter='REJECTED';load()">Bad</button>
</div>
</div>
<div id="list">Loading voices...</div>

<script>
const SUPA_URL="https://rupuxvpupdhlhxgjrbsh.supabase.co";
const SUPA_KEY="sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const RATE=500/5400; // ₦0.09259 per sec
let filter='UNCHECKED';

async function load(){
let q=sb.from('voices').select('*').order('created_at',{ascending:false}).limit(100);
if(filter!='all') q=q.eq('status',filter);
const {data}=await q;
if(!data){document.getElementById('list').innerHTML='No data';return}
let totalSecs=0,totalPay=0,waiting=0;
data.forEach(v=>{totalSecs+=parseFloat(v.duration_seconds||0); if(v.status=='UNCHECKED')waiting++});
totalPay=totalSecs*RATE;
document.getElementById('stats').innerHTML=`Total: ${data.length} voices • ${Math.floor(totalSecs)}s • <b>₦${totalPay.toFixed(2)}</b> to pay • Waiting: ${waiting}`;

document.getElementById('list').innerHTML=data.map(v=>{
const secs=Math.round(v.duration_seconds||0);
const earn=secs*RATE;
const bank=`${v.account_name||''} ${v.account_number||''} ${v.bank_name||''}`;
return `<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<div><b>${v.name||v.user_name}</b> <span style="font-size:11px;background:#ff6b81;padding:2px 6px;border-radius:6px">${v.status}</span> <span style="color:#f1c40f;font-weight:800">₦${earn.toFixed(2)}</span></div>
<button class="playBtn" onclick="document.getElementById('a${v.id}').play()">▶️ Play</button>
</div>
<div style="font-size:12px;opacity:0.8;margin:6px 0">${secs}s recorded • ${v.location||'No location'} • ${bank}</div>
<audio id="a${v.id}" src="${v.audio_url}" style="display:none"></audio>
<div style="display:flex;gap:6px;margin-top:8px">
<button class="btn btn-green" style="flex:1" onclick="approve('${v.id}',${secs})">APPROVE FULL</button>
<button class="btn btn-red" style="flex:1" onclick="reject('${v.id}')">REJECT</button>
<button class="btn" style="background:#444;color:#fff" onclick="del('${v.id}')">DELETE</button>
</div>
</div>`;
}).join('');
}

async function approve(id,secs){
await sb.from('voices').update({status:'QUALIFIED',approved_duration_seconds:secs,quality_score:Math.round(secs*RATE*100)}).eq('id',id);
load();
}
async function reject(id){
await sb.from('voices').update({status:'REJECTED'}).eq('id',id);
load();
}
async function del(id){
if(!confirm('Delete this?'))return;
await sb.from('voices').delete().eq('id',id);
load();
}
load();
</script>
</body>
</html>
