<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ademi Panel - Chairman Only</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0f0c29;color:#fff;padding:12px}
.card{background:rgba(255,255,255,.1);border-radius:14px;padding:14px;margin:12px 0;border:1px solid rgba(255,255,255,.15)}
.btn{padding:12px;border-radius:10px;border:none;font-weight:800;width:100%;margin:6px 0;font-size:15px}
input,textarea{width:100%;padding:12px;border-radius:10px;background:rgba(0,0,0,.4);color:#fff;border:1px solid #555;margin:6px 0;font-size:15px}
.h{display:none!important}
</style>
</head>
<body>
<h2 style="text-align:center;margin:10px 0">👑 Ademi Panel 🤖</h2>
<p style="text-align:center;font-size:12px;opacity:.7">Chairman Only - AI Inspector</p>

<div id="login" class="card">
<h4>🔐 Chairman Login</h4>
<input type="password" id="pass" placeholder="Enter Ademi@2026Secure!">
<button class="btn" style="background:#feca57;color:#000" onclick="window.login()">Enter 👑</button>
<p style="font-size:11px;margin-top:6px;opacity:.6">Password: Ademi@2026Secure!</p>
</div>

<div id="main" class="h">
<div class="card" style="background:linear-gradient(135deg,#2ed573,#1e90ff)">
<h4>📢 Post Announcement (E go show for user homepage)</h4>
<input id="aT" placeholder="Title: e.g Welcome to Pidgin Voice">
<textarea id="aM" rows="3" placeholder="Message: e.g Drop your best Pidgin today!"></textarea>
<button class="btn" style="background:#fff;color:#000" onclick="window.postA()">📢 Post Now</button>
<div id="aList" style="font-size:12px;margin-top:10px"></div>
</div>

<div class="card">
<h4>🤖 AI Inspector - Best Voice on Top (Auto Score)</h4>
<div style="display:flex;gap:6px;margin:8px 0">
<button class="btn" style="background:#fff;color:#000;flex:1" onclick="window.filterA('all')">All</button>
<button class="btn" style="background:#2ed573;color:#000;flex:1" onclick="window.filterA('good')">🟢 Good (60%+)</button>
<button class="btn" style="background:#ff4757;color:#fff;flex:1" onclick="window.filterA('bad')">🔴 Bad</button>
</div>
<div id="listA" style="margin-top:10px">Loading voices... If e still dey here after 5 sec, reload page.</div>
</div>

<div class="card" style="text-align:center">
<button class="btn" style="background:rgba(255,255,255,.15)" onclick="location.href='index.html'">⬅️ Go to User Page</button>
<button class="btn" style="background:#ff4757;color:#fff" onclick="window.logout()">Logout</button>
</div>
</div>

<script>
const SUPA_URL="https://rupuxvpupdhlhxgjrbsh.supabase.co";
const SUPA_KEY="sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY";
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

window.login=function(){
let p=document.getElementById('pass').value;
if(p==='Ademi@2026Secure!'){
document.getElementById('login').classList.add('h');
document.getElementById('main').classList.remove('h');
load();loadAnn();
}else alert('Wrong password! Na Ademi@2026Secure!');
}
window.logout=function(){location.reload()}

async function load(){
try{
let {data,error}=await sb.from('voices').select('*').order('quality_score',{ascending:false}).limit(200);
if(error) throw error;
if(!data||!data.length){document.getElementById('listA').innerHTML='No voices yet - Tell users to record for index.html';return}
document.getElementById('listA').innerHTML=data.map(v=>{
let c=v.quality_score>=75?'#2ed573':v.quality_score>=45?'#ffa502':'#ff4757';
return `<div class="vItem" data-sc="${v.quality_score||0}" style="border-left:6px solid ${c};background:rgba(0,0,0,.35);padding:12px;margin:10px 0;border-radius:12px;font-size:13px">
<b style="font-size:14px">${v.name}</b> - <b style="color:${c}">${v.quality_score||0}%</b> <small>${v.ai_verdict||''}</small> <small style="float:right">⏱️ ${v.duration_seconds||0}s</small><br>
<small style="opacity:.8">📍 ${v.location||'No location'} | ${new Date(v.created_at).toLocaleDateString()}</small><br>
<div style="background:rgba(255,255,255,.07);padding:8px;border-radius:8px;margin:6px 0;font-size:12px">"${(v.transcript||'No transcript').slice(0,150)}"</div>
<audio controls src="${v.audio_url}" style="width:100%;height:32px;margin:6px 0"></audio>
<button onclick="window.delV('${v.id}')" style="background:#ff4757;color:#fff;border:none;padding:8px;border-radius:8px;width:100%;font-weight:700;margin-top:6px">🗑️ Delete This Voice</button>
</div>`}).join('');
}catch(e){document.getElementById('listA').innerHTML='Error: '+e.message+'<br>Check Supabase table voices';}
}
async function loadAnn(){
let {data}=await sb.from('announcements').select('*').order('created_at',{ascending:false});
document.getElementById('aList').innerHTML=(data||[]).map(a=>`<div style="background:rgba(0,0,0,.25);padding:8px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center"><span><b>${a.title}</b><br><small>${a.message}</small></span><button onclick="window.delA('${a.id}')" style="background:#ff4757;color:#fff;border:none;padding:4px 8px;border-radius:6px">X</button></div>`).join('')||'No announcements yet';
}
window.postA=async function(){
let t=document.getElementById('aT').value.trim();
let m=document.getElementById('aM').value.trim();
if(!t||!m) return alert('Fill title and message');
try{await sb.from('announcements').insert([{title:t,message:m}]);alert('✅ Posted! Users go see am for homepage');document.getElementById('aT').value='';document.getElementById('aM').value='';loadAnn();}catch(e){alert('Error: '+e.message)}
}
window.delA=async function(id){if(!confirm('Delete announcement?'))return;await sb.from('announcements').delete().eq('id',id);loadAnn()}
window.delV=async function(id){if(!confirm('Delete this voice permanently?'))return;let {error}=await sb.from('voices').delete().eq('id',id);if(error) alert(error.message);else load()}
window.filterA=function(t){
document.querySelectorAll('.vItem').forEach(e=>{
let s=parseInt(e.dataset.sc)||0;
if(t==='all') e.style.display='block';
else if(t==='good') e.style.display=s>=60?'block':'none';
else e.style.display=s<60?'block':'none';
})
}
</script>
</body>
</html>
