<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ademi Pidgin Voice - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #17202a;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    header {
      background: #123b2e;
      color: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd6d1;
      border-radius: 9px;
      font-size: 15px;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    label {
      font-weight: bold;
    }

    button {
      border: none;
      padding: 10px 14px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      margin: 3px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .green {
      background: #087f5b;
      color: white;
    }

    .gray {
      background: #e5eee9;
      color: #123b2e;
    }

    .red {
      background: #ffe3e3;
      color: #a51d1d;
    }

    .hidden {
      display: none !important;
    }

    .status {
      background: #eef4f1;
      padding: 12px;
      border-radius: 9px;
      margin-top: 12px;
      white-space: pre-wrap;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 15px 0;
    }

    .filters button.active {
      background: #087f5b;
      color: white;
    }

    .voice {
      border: 1px solid #d7e1dc;
      border-radius: 13px;
      padding: 16px;
      margin-top: 15px;
    }

    .voice h3 {
      margin-top: 0;
    }

    .voice audio {
      width: 100%;
      margin: 12px 0;
    }

    .details {
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(200px, 1fr)
      );
      gap: 12px;
    }

    .small {
      color: #52615a;
      font-size: 14px;
    }

    .danger-box {
      background: #fff4f4;
      padding: 12px;
      border-radius: 9px;
      color: #8d2020;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Ademi Pidgin Voice</h1>
    <p>Chairman Admin Dashboard</p>
  </header>


  <!-- LOGIN -->

  <section class="card" id="loginSection">

    <h2>Admin Login</h2>

    <p class="small">
      Only authorized admin accounts should use this page.
    </p>

    <form id="loginForm">

      <label>Email</label>
      <input
        id="email"
        type="email"
        required
        autocomplete="username"
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
      >

      <button
        class="green"
        type="submit"
      >
        Sign In
      </button>

    </form>

    <div
      id="loginStatus"
      class="status"
    >
      Enter your admin account.
    </div>

  </section>


  <!-- DASHBOARD -->

  <div
    id="dashboard"
    class="hidden"
  >

    <section class="card">

      <div class="grid">

        <div>
          <h2>Recordings</h2>

          <div
            id="counts"
            class="small"
          >
            Loading...
          </div>
        </div>

        <div>

          <label>
            Search
          </label>

          <input
            id="search"
            type="text"
            placeholder="Search contributor, bank..."
          >

        </div>

        <div>

          <button
            id="refreshButton"
            class="gray"
          >
            🔄 Refresh
          </button>

          <button
            id="logoutButton"
            class="red"
          >
            Sign Out
          </button>

        </div>

      </div>


      <!-- FILTERS -->

      <div class="filters">

        <button
          class="active"
          data-filter="ALL"
        >
          All
        </button>

        <button
          data-filter="UNCHECKED"
        >
          Unchecked
        </button>

        <button
          data-filter="QUALIFIED"
        >
          Qualified
        </button>

        <button
          data-filter="REJECTED"
        >
          Rejected
        </button>

        <button
          data-filter="PAID"
        >
          Paid
        </button>

      </div>


      <div
        id="mainStatus"
        class="status"
      >
        Loading recordings...
      </div>


      <div id="voices"></div>

    </section>


    <!-- ANNOUNCEMENT -->

    <section class="card">

      <h2>📢 Announcement</h2>

      <p class="small">
        This message will appear on the recording page.
      </p>

      <textarea
        id="announcementText"
        rows="4"
        placeholder="Write announcement here..."
      ></textarea>

      <button
        id="publishAnnouncement"
        class="green"
      >
        Publish Announcement
      </button>

      <button
        id="clearAnnouncement"
        class="red"
      >
        Clear Announcement
      </button>

      <div
        id="announcementStatus"
        class="status"
      ></div>

    </section>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rupuxvpupdhlhxgjrbsh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hp";

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   VARIABLES
========================================= */

let recordings = [];

let currentFilter = "ALL";

let currentUser = null;


/* =========================================
   ELEMENTS
========================================= */

const loginSection =
document.getElementById("loginSection");

const dashboard =
document.getElementById("dashboard");

const loginForm =
document.getElementById("loginForm");

const loginStatus =
document.getElementById("loginStatus");

const voices =
document.getElementById("voices");

const mainStatus =
document.getElementById("mainStatus");

const counts =
document.getElementById("counts");

const search =
document.getElementById("search");


/* =========================================
   SESSION CHECK
========================================= */

async function checkSession() {

  const {
    data
  } =
  await supabase.auth.getSession();

  currentUser =
    data.session
      ? data.session.user
      : null;


  if (currentUser) {

    loginSection
      .classList
      .add("hidden");

    dashboard
      .classList
      .remove("hidden");

    loadRecordings();

  }

  else {

    loginSection
      .classList
      .remove("hidden");

    dashboard
      .classList
      .add("hidden");

  }

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    loginStatus.textContent =
      "Signing in...";


    const email =
      document
      .getElementById("email")
      .value
      .trim();


    const password =
      document
      .getElementById("password")
      .value;


    const {
      error
    } =
    await supabase.auth.signInWithPassword({

      email: email,

      password: password

    });


    if (error) {

      loginStatus.textContent =
        "Login failed: "
        + error.message;

      return;

    }


    loginStatus.textContent =
      "Login successful.";

    checkSession();

  }
);


/* =========================================
   LOGOUT
========================================= */

document
.getElementById("logoutButton")
.addEventListener(
  "click",
  async () => {

    await supabase.auth.signOut();

    recordings = [];

    checkSession();

  }
);


/* =========================================
   LOAD RECORDINGS
========================================= */

async function loadRecordings() {

  mainStatus.textContent =
    "Loading recordings...";


  const {
    data,
    error
  } =
  await supabase
    .from("voices")
    .select("*")
    .order(
      "created_at",
      {
        ascending: false
      }
    )
    .limit(500);


  if (error) {

    mainStatus.textContent =
      "Could not load recordings:\n"
      + error.message;

    return;

  }


  recordings =
    data || [];


  updateCounts();

  renderRecordings();


  if (recordings.length === 0) {

    mainStatus.textContent =
      "No recordings submitted yet.";

  }

  else {

    mainStatus.textContent =
      recordings.length
      + " recording(s) loaded.";

  }

}


/* =========================================
   COUNTS
========================================= */

function updateCounts() {

  let unchecked = 0;

  let qualified = 0;

  let rejected = 0;

  let paid = 0;


  recordings.forEach(
    recording => {

      const status =
        String(
          recording.status ||
          "UNCHECKED"
        ).toUpperCase();


      if (status === "UNCHECKED")
        unchecked++;

      if (status === "QUALIFIED")
        qualified++;

      if (status === "REJECTED")
        rejected++;

      if (
        status === "PAID" ||
        recording.is_paid === true
      )
        paid++;

    }
  );


  counts.textContent =
    "Total: "
    + recordings.length
    + " | Unchecked: "
    + unchecked
    + " | Qualified: "
    + qualified
    + " | Rejected: "
    + rejected
    + " | Paid: "
    + paid;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   RENDER
========================================= */

function renderRecordings() {

  const query =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    recordings.filter(
      recording => {

        const status =
          String(
            recording.status ||
            "UNCHECKED"
          ).toUpperCase();


        let filterMatch = true;


        if (
          currentFilter !== "ALL"
        ) {

          if (
            currentFilter === "PAID"
          ) {

            filterMatch =
              status === "PAID" ||
              recording.is_paid === true;

          }

          else {

            filterMatch =
              status === currentFilter;

          }

        }


        const searchable = [

          recording.admin_name,

          recording.account_name,

          recording.account_number,

          recording.bank_name,

          recording.bank_account,

          recording.location,

          recording.status,

          recording.bio

        ]
        .join(" ")
        .toLowerCase();


        return (
          filterMatch &&
          searchable.includes(query)
        );

      }
    );


  voices.innerHTML = "";


  filtered.forEach(
    recording => {

      voices.appendChild(
        createRecordingCard(
          recording
        )
      );

    }
  );

}


/* =========================================
   RECORDING CARD
========================================= */

function createRecordingCard(
  recording
) {

  const card =
    document.createElement("div");

  card.className =
    "voice";


  const status =
    String(
      recording.status ||
      "UNCHECKED"
    ).toUpperCase();


  const originalDuration =
    Number(
      recording.duration || 0
    );


  const approvedDuration =
    Number(
      recording.second_duration_seconds ??
      recording.approved_duration_seconds ??
      recording.duration ??
      0
    );


  const amount =
    Number(
      recording.amount || 0
    );


  const paid =
    status === "PAID" ||
    recording.is_paid === true;


  card.innerHTML = `

    <h3>
      ${escapeHTML(
        recording.admin_name ||
        "Unnamed contributor"
      )}

      <span class="small">
        • ${escapeHTML(status)}
      </span>
    </h3>


    ${
      recording.audio_url
      ?
      `
      <audio
        controls
        preload="none"
        src="${escapeHTML(
          recording.audio_url
        )}"
      ></audio>
      `
      :
      `
      <div class="danger-box">
        No audio URL found.
      </div>
      `
    }


    <div class="details">

      <strong>Submitted:</strong>
      ${escapeHTML(
        recording.created_at ||
        "Unknown"
      )}
      <br>

      <strong>Original duration:</strong>
      ${originalDuration} seconds
      <br>

      <strong>Approved/payable duration:</strong>
      ${approvedDuration} seconds
      <br>

      <strong>Location:</strong>
      ${escapeHTML(
        recording.location ||
        "Not supplied"
      )}
      <br>

      <strong>Bank:</strong>
      ${escapeHTML(
        recording.bank_name ||
        ""
      )}
      <br>

      <strong>Account name:</strong>
      ${escapeHTML(
        recording.account_name ||
        ""
      )}
      <br>

      <strong>Account number:</strong>
      ${escapeHTML(
        recording.account_number ||
        recording.bank_account ||
        ""
      )}
      <br>

      <strong>Notes:</strong>
      ${escapeHTML(
        recording.bio ||
        "None"
      )}
      <br>

      <strong>Amount:</strong>
      ₦${amount.toLocaleString()}

      ${
        paid
        ?
        `
        <br>
        <strong>Payment status:</strong>
        ✅ PAID
        `
        :
        ""
      }

    </div>


    <div class="grid">

      <div>

        <label>
          Approved duration
        </label>

        <input
          class="approvedDuration"
          type="number"
          min="0"
          step="1"
          value="${approvedDuration}"
        >

      </div>


      <div>

        <label>
          Amount to pay
        </label>

        <input
          class="amount"
          type="number"
          min="0"
          step="1"
          value="${amount}"
        >

      </div>


      <div>

        <label>
          Reviewer note
        </label>

        <input
          class="reviewerNote"
          type="text"
          maxlength="1000"
          placeholder="Optional note"
        >

      </div>

    </div>


    <div>

      <button
        class="green"
        data-action="save"
      >
        💾 Save Review
      </button>


      <button
        class="gray"
        data-action="approve"
      >
        ✅ Approve
      </button>


      <button
        class="gray"
        data-action="middle"
      >
        ⏱️ Set Approved Time
      </button>


      <button
        class="red"
        data-action="reject"
      >
        ❌ Reject
      </button>


      <button
        class="green"
        data-action="paid"
      >
        💰 Mark Paid
      </button>


      <button
        class="red"
        data-action="delete"
      >
        🗑 Delete
      </button>

    </div>


    <div class="status result"></div>

  `;


  return card;

}


/* =========================================
   BUTTON ACTIONS
========================================= */

voices.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if (!button)
      return;


    const card =
      button.closest(".voice");


    const action =
      button.dataset.action;


    const cards =
      Array.from(
        document.querySelectorAll(
          ".voice"
        )
      );


    const index =
      cards.indexOf(card);


    const visible =
      recordings.filter(
        recording => {

          const status =
            String(
              recording.status ||
              "UNCHECKED"
            ).toUpperCase();

          const query =
            search.value
              .trim()
              .toLowerCase();


          let filterMatch = true;


          if (
            currentFilter !== "ALL"
          ) {

            filterMatch =
              currentFilter === "PAID"
              ?
              (
                status === "PAID" ||
                recording.is_paid === true
              )
              :
              status === currentFilter;

          }


          const searchable = [

            recording.admin_name,
            recording.account_name,
            recording.account_number,
            recording.bank_name,
            recording.bank_account,
            recording.location,
            recording.status,
            recording.bio

          ]
          .join(" ")
          .toLowerCase();


          return (
            filterMatch &&
            searchable.includes(query)
          );

        }
      );


    const recording =
      visible[index];


    if (!recording)
      return;


    const result =
      card.querySelector(
        ".result"
      );


    try {

      button.disabled = true;

      result.textContent =
        "Saving...";


      /* DELETE */

      if (action === "delete") {

        const confirmDelete =
          confirm(
            "Are you sure you want to delete this recording record?"
          );


        if (!confirmDelete) {

          button.disabled = false;

          result.textContent = "";

          return;

        }


        const {
          error
        } =
        await supabase
          .from("voices")
          .delete()
          .eq(
            "id",
            recording.id
          );


        if (error)
          throw error;


        result.textContent =
          "Deleted.";

        await loadRecordings();

        return;

      }


      /* INPUT VALUES */

      const approvedInput =
        Number(
          card
          .querySelector(
            ".approvedDuration"
          )
          .value
        );


      const amountInput =
        Number(
          card
          .querySelector(
            ".amount"
          )
          .value
        );


      const note =
        card
        .querySelector(
          ".reviewerNote"
        )
        .value
        .trim();


      if (
        !Number.isFinite(
          approvedInput
        ) ||
        approvedInput < 0
      ) {

        throw new Error(
          "Approved duration is not valid."
        );

      }


      if (
        !Number.isFinite(
          amountInput
        ) ||
        amountInput < 0
      ) {

        throw new Error(
          "Amount is not valid."
        );

      }


      const updateData = {

        second_duration_seconds:
          approvedInput,

        amount:
          Math.round(
            amountInput
          )

      };


      /* APPROVE */

      if (
        action === "approve"
      ) {

        updateData.status =
          "QUALIFIED";

      }


      /* REJECT */

      if (
        action === "reject"
      ) {

        updateData.status =
          "REJECTED";

      }


      /* PAID */

      if (
        action === "paid"
      ) {

        updateData.status =
          "PAID";

        updateData.is_paid =
          true;

        updateData.paid_at =
          new Date()
          .toISOString();

      }


      /* SET APPROVED TIME */

      if (
        action === "middle"
      ) {

        updateData.status =
          "QUALIFIED";

      }


      /* NOTE */

      if (note) {

        updateData.inspector_note =
          note;

      }


      /* SAVE */

      const {
        error
      } =
      await supabase
        .from("voices")
        .update(updateData)
        .eq(
          "id",
          recording.id
        );


      if (error)
        throw error;


      result.textContent =
        "✅ Saved successfully.";


      await loadRecordings();

    }

    catch (error) {

      result.textContent =
        "❌ Error: "
        + error.message;

    }

    finally {

      button.disabled = false;

    }

  }
);


/* =========================================
   FILTERS
========================================= */

document
.querySelector(".filters")
.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button[data-filter]"
      );


    if (!button)
      return;


    currentFilter =
      button.dataset.filter;


    document
      .querySelectorAll(
        ".filters button"
      )
      .forEach(
        item =>
          item.classList.toggle(
            "active",
            item === button
          )
      );


    renderRecordings();

  }
);


/* =========================================
   SEARCH
========================================= */

search.addEventListener(
  "input",
  renderRecordings
);


/* =========================================
   REFRESH
========================================= */

document
.getElementById("refreshButton")
.addEventListener(
  "click",
  loadRecordings
);


/* =========================================
   ANNOUNCEMENT
========================================= */

async function loadAnnouncement() {

  const {
    data,
    error
  } =
  await supabase
    .from("announcements")
    .select("*")
    .order(
      "created_at",
      {
        ascending: false
      }
    )
    .limit(1);


  if (error)
    return;


  if (
    data &&
    data.length > 0
  ) {

    const latest =
      data[0];


    document
      .getElementById(
        "announcementText"
      )
      .value =
        latest.message ||
        latest.content ||
        latest.title ||
        "";

  }

}


/* =========================================
   PUBLISH ANNOUNCEMENT
========================================= */

document
.getElementById(
  "publishAnnouncement"
)
.addEventListener(
  "click",
  async () => {

    const message =
      document
      .getElementById(
        "announcementText"
      )
      .value
      .trim();


    if (!message) {

      document
        .getElementById(
          "announcementStatus"
        )
        .textContent =
          "Write an announcement first.";

      return;

    }


    const {
      error
    } =
    await supabase
      .from("announcements")
      .insert({
        message: message
      });


    document
      .getElementById(
        "announcementStatus"
      )
      .textContent =
        error
        ?
        "Error: "
        + error.message
        :
        "✅ Announcement published.";

  }
);


/* =========================================
   CLEAR ANNOUNCEMENT
========================================= */

document
.getElementById(
  "clearAnnouncement"
)
.addEventListener(
  "click",
  async () => {

    if (
      !confirm(
        "Clear the latest announcement?"
      )
    )
      return;


    const {
      data,
      error
    } =
    await supabase
      .from("announcements")
      .select("id")
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(1);


    if (error) {

      document
        .getElementById(
          "announcementStatus"
        )
        .textContent =
          error.message;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      document
        .getElementById(
          "announcementStatus"
        )
        .textContent =
          "No announcement found.";

      return;

    }


    const {
      error: deleteError
    } =
    await supabase
      .from("announcements")
      .delete()
      .eq(
        "id",
        data[0].id
      );


    document
      .getElementById(
        "announcementStatus"
      )
      .textContent =
        deleteError
        ?
        deleteError.message
        :
        "✅ Announcement cleared.";

  }
);


/* =========================================
   AUTH LISTENER
========================================= */

supabase.auth.onAuthStateChange(
  (_event, session) => {

    currentUser =
      session?.user || null;


    if (currentUser) {

      loginSection
        .classList
        .add("hidden");

      dashboard
        .classList
        .remove("hidden");

      setTimeout(
        loadRecordings,
        0
      );

    }

    else {

      loginSection
        .classList
        .remove("hidden");

      dashboard
        .classList
        .add("hidden");

    }
