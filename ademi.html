<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ademi Panel</title><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0f0c29;color:#fff;padding:10px}.card{background:rgba(255,255,255,.1);border-radius:12px;padding:12px;margin:10px 0}.btn{padding:10px;border-radius:8px;border:none;font-weight:700;width:100%;margin:5px 0}input,textarea{width:100%;padding:10px;border-radius:8px;background:rgba(0,0,0,.3);color:#fff;border:1px solid #555;margin:5px 0}.h{display:none!important}</style></head><body>
<h2 style="text-align:center">👑 Ademi Panel - AI Inspector 🤖</h2>
<div id="login" class="card"><input type="password" id="pass" placeholder="Password Ademi@2026Secure!"><button class="btn" style="background:#feca57;color:#000" onclick="window.login()">Enter 👑</button></div>
<div id="main" class="h">
<div class="card"><h4>📢 Post Announcement</h4><input id="aT" placeholder="Title: e.g Welcome"><textarea id="aM" placeholder="Message"></textarea><button class="btn" style="background:#2ed573" onclick="window.postA()">Post Now</button><div id="aList" style="font-size:12px;margin-top:8px"></div></div>
<div class="card"><h4>🤖 Automatic AI Inspector - Best on Top</h4><div style="display:flex;gap:5px"><button class="btn" style="background:#fff;color:#000" onclick="window.filterA('all')">All</button><button class="btn" style="background:#2ed573" onclick="window.filterA('good')">🟢 Good</button><button class="btn" style="background:#ff4757" onclick="window.filterA('bad')">🔴 Bad</button></div><div id="listA">Loading voices...</div></div>
</div>
<script>
const sb=window.supabase.createClient("https://rupuxvpupdhlhxgjrbsh.supabase.co","sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY");
window.login=function(){if(document.getElementById('pass').value==='Ademi@2026Secure!'){document.getElementById('login').classList.add('h');document.getElementById('main').classList.remove('h');load();loadAnn()}else alert('Wrong password')}
async function load(){let {data}=await sb.from('voices').select('*').order('quality_score',{ascending:false}).limit(200);if(!data||!data.length){document.getElementById('listA').innerHTML='No voices yet';return}document.getElementById('listA').innerHTML=data.map(v=>{let c=v.quality_score>=75?'#2ed573':v.quality_score>=45?'#ffa502':'#ff4757';return `<div class="vItem" data-sc="${v.quality_score||0}" style="border-left:5px solid ${c};background:rgba(0,0,0,.3);padding:10px;margin:8px 0;border-radius:10px;font-size:13px"><b>${v.name}</b> - <b>${v.quality_score||0}%</b> - ${v.ai_verdict||''}<br><small>${(v.transcript||'').slice(0,100)}</small><br><audio controls src="${v.audio_url}" style="width:100%;height:30px;margin:5px 0"></audio><br><small>⏱️ ${v.duration_seconds||0}s | 📍 ${v.location||''}</small><br><button onclick="window.delV('${v.id}')" style="background:#ff4757;color:#fff;border:none;padding:6px 10px;border-radius:6px;margin-top:6px;width:100%">🗑️ Delete</button></div>`}).join('')}
async function loadAnn(){let {data}=await sb.from('announcements').select('*').order('created_at',{ascending:false});document.getElementById('aList').innerHTML=(data||[]).map(a=>`<div style="background:rgba(0,0,0,.2);padding:6px;border-radius:6px;margin:4px 0">${a.title} <button onclick="window.delA('${a.id}')" style="background:#ff4757;color:#fff;border:none;padding:2px 6px;border-radius:4px">X</button><br><small>${a.message}</small></div>`).join('')}
window.postA=async function(){let t=document.getElementById('aT').value;let m=document.getElementById('aM').value;if(!t||!m)return alert('Fill title and message');await sb.from('announcements').insert([{title:t,message:m}]);alert('Posted!');document.getElementById('aT').value='';document.getElementById('aM').value='';loadAnn()}
window.delA=async function(id){await sb.from('announcements').delete().eq('id',id);loadAnn()}
window.delV=async function(id){if(!confirm('Delete this voice?'))return;await sb.from('voices').delete().eq('id',id);load()}
window.filterA=function(t){document.querySelectorAll('.vItem').forEach(e=>{let s=parseInt(e.dataset.sc)||0;if(t==='all')e.style.display='block';else if(t==='good')e.style.display=s>=60?'block':'none';else e.style.display=s<60?'block':'none'})}
</script></body></html>
