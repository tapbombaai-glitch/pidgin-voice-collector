<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLECTOR - PACKAGER PRO MAX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
body{font-family:sans-serif;background:#0a0a0a;color:#fff;padding:15px;max-width:600px;margin:0 auto}
.card{background:#1a1a1a;padding:15px;border-radius:12px;margin-bottom:15px;border:1px solid #333}
button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer}
.yellow{background:#FFC107;color:#000}
.green{background:#00ff88;color:#000}
.blue{background:#0088ff;color:#fff}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#000;color:#fff;margin-top:5px}
label{font-size:12px;color:#aaa;margin-top:10px;display:block}
</style>
</head>
<body>

<h2>🎧 LLECTOR PACKAGER - Sell for $150/hr</h2>

<div class="card">
<label>Supabase URL</label>
<input id="sbUrl" value="https://rupuxvpupdhlhxgjrbsh.supabase.co">
<label>Supabase Anon Key</label>
<input id="sbKey" value="sb_publishable_DQ27GSl6cVVYy8s5U4ZsFA_ye9e-hpY">
<label>Worker Name to Package (e.g. Adiam)</label>
<input id="workerName" value="Adiam">
<button class="blue" onclick="loadVoices()">1. LOAD VOICES FROM SUPABASE</button>
</div>

<div id="voicesList"></div>

<div class="card">
<h3>Step 2,3,4: Package Selected</h3>
<label>Split long audio into (seconds)</label>
<select id="splitSec"><option value="12">12 sec clips (Best for AI)</option><option value="10">10 sec</option><option value="15">15 sec</option></select>
<button class="yellow" onclick="packageAll()">2. CLEAN + SEGMENT + CREATE CSV + METADATA</button>
<button class="green" onclick="downloadZip()">3. DOWNLOAD FINAL DATASET ZIP ($150/hr READY)</button>
<div id="status" style="margin-top:10px;color:#00ff88"></div>
</div>

<script>
let VOICES = [];
let PACKAGED = [];
let META = [];

async function loadVoices(){
 const url = document.getElementById('sbUrl').value.trim();
 const key = document.getElementById('sbKey').value.trim();
 const worker = document.getElementById('workerName').value.trim();
 document.getElementById('status').innerText = "Loading...";
 try{
   let res = await fetch(`${url}/rest/v1/voices?select=*&name=ilike.%${worker}%`, {
     headers:{apikey:key, Authorization:`Bearer ${key}`}
   });
   VOICES = await res.json();
   if(VOICES.length===0){
     res = await fetch(`${url}/rest/v1/voices?select=*&user_name=ilike.%${worker}%`, {
       headers:{apikey:key, Authorization:`Bearer ${key}`}
     });
     VOICES = await res.json();
   }
   let html = "";
   VOICES.forEach((v,i)=>{
     html+=`<div class="card">
     <input type="checkbox" checked id="chk_${i}"> <b>${v.name||v.user_name} - ${v.duration_seconds||0}s - ${v.status}</b><br>
     <audio controls src="${v.audio_url}" style="width:100%;margin-top:8px"></audio>
     <label>Transcript for this file (correct Pidgin exactly)</label>
     <textarea id="txt_${i}" placeholder="Type exactly wetin dem talk...">${v.transcript||'How you dey, I dey come Port Harcourt tomorrow'}</textarea>
     <label>Age</label><input id="age_${i}" value="22">
     <label>Gender</label><select id="gen_${i}"><option>female</option><option>male</option></select>
     </div>`;
   });
   document.getElementById('voicesList').innerHTML = html || `<p style='text-align:center'>No voice found for ${worker}</p>`;
   document.getElementById('status').innerText = `Loaded ${VOICES.length} files`;
 }catch(e){ document.getElementById('status').innerText = "Error: "+e.message; }
}

async function packageAll(){
 PACKAGED=[]; META=[];
 document.getElementById('status').innerText = "Packaging... no close browser, fit take 1-2 mins!";
 const split = parseInt(document.getElementById('splitSec').value);
 for(let i=0;i<VOICES.length;i++){
   if(!document.getElementById(`chk_${i}`)?.checked) continue;
   const v = VOICES[i];
   const fullText = document.getElementById(`txt_${i}`).value.trim() || v.transcript || "How you dey";
   try{
     const audioBlob = await fetch(v.audio_url).then(r=>r.blob());
     const audioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
     const arrayBuffer = await audioBlob.arrayBuffer();
     const decoded = await audioCtx.decodeAudioData(arrayBuffer);
     const duration = decoded.duration;
     const numChunks = Math.ceil(duration / split);
     for(let c=0;c<numChunks;c++){
       const start = c*split;
       const end = Math.min((c+1)*split, duration);
       const chunkDuration = end-start;
       if(chunkDuration < 0.5) continue;
       const chunkBuffer = audioCtx.createBuffer(1, Math.floor(chunkDuration*16000), 16000);
       const startSample = Math.floor(start * decoded.sampleRate);
       const endSample = Math.floor(end * decoded.sampleRate);
       const sliced = decoded.getChannelData(0).slice(startSample, endSample);
       const ratio = decoded.sampleRate / 16000;
       for(let j=0;j<chunkBuffer.length;j++){ chunkBuffer.getChannelData(0)[j] = sliced[Math.floor(j*ratio)] || 0; }
       const wavBlob = bufferToWav(chunkBuffer);
       const workerName = (v.name||v.user_name||'worker').replace(/\s+/g,'_');
       const fileName = `${workerName}_${String(i).padStart(3,'0')}_${String(c).padStart(3,'0')}.wav`;
       const sentences = fullText.split(/[.!?]+/).filter(s=>s.trim());
       const textChunk = sentences[c] || sentences[0] || fullText;
       PACKAGED.push({fileName, blob:wavBlob, text: textChunk.trim()});
       META.push({file_name:fileName, speaker_id:`${workerName}_PH_01`, duration: chunkDuration.toFixed(2), text: textChunk.trim(), age: document.getElementById(`age_${i}`).value, gender: document.getElementById(`gen_${i}`).value, language:"Nigerian Pidgin", accent:"Port Harcourt", environment:"quiet indoor", sample_rate:16000, status:v.status});
     }
     await audioCtx.close();
   }catch(e){ console.log(e); }
 }
 document.getElementById('status').innerText = `Packaged! ${PACKAGED.length} WAV files ready. Now click DOWNLOAD ZIP`;
}

function bufferToWav(buffer){
 const numChannels=1; const sampleRate=16000; const format=1; const bitDepth=16;
 const dataLength = buffer.length * 2; const headerLength=44;
 const arrayBuffer = new ArrayBuffer(headerLength+dataLength);
 const view = new DataView(arrayBuffer);
 writeString(view,0,'RIFF'); view.setUint32(4,36+dataLength,true); writeString(view,8,'WAVE');
 writeString(view,12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,format,true); view.setUint16(22,numChannels,true);
 view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*numChannels*2,true); view.setUint16(32,numChannels*2,true); view.setUint16(34,bitDepth,true);
 writeString(view,36,'data'); view.setUint32(40,dataLength,true);
 const channelData = buffer.getChannelData(0); let offset=44;
 for(let i=0;i<channelData.length;i++,offset+=2){ const s=Math.max(-1,Math.min(1,channelData[i])); view.setInt16(offset,s<0?s*0x8000:s*0x7FFF,true); }
 return new Blob([view],{type:'audio/wav'});
}
function writeString(view,offset,string){for(let i=0;i<string.length;i++) view.setUint8(offset+i,string.charCodeAt(i))}
async function downloadZip(){
 if(PACKAGED.length===0){ alert("Package first!"); return; }
 const zip = new JSZip(); const audios = zip.folder("audios");
 PACKAGED.forEach(p=>audios.file(p.fileName,p.blob));
 let csv = "audio_file,text\n"; PACKAGED.forEach(p=>{csv+=`${p.fileName},"${p.text.replace(/"/g,'""')}"\n`});
 zip.file("transcripts.csv",csv); zip.file("metadata.json",JSON.stringify(META,null,2));
 const totalHours = (META.reduce((a,m)=>a+parseFloat(m.duration),0)/3600).toFixed(2);
 zip.file("README.md",`# Nigerian Pidgin Dataset - Packaged by LLECTOR\nHours: ${totalHours}\nLanguage: Nigerian Pidgin (Port Harcourt)\nFormat: WAV 16kHz Mono\nTotal Files: ${PACKAGED.length}\nReady to sell $80-$200/hour\n`);
 const blob = await zip.generateAsync({type:"blob"}); saveAs(blob, `LLECTOR_Pidgin_${totalHours}h_${new Date().toISOString().slice(0,10)}.zip`);
 document.getElementById('status').innerText = `ZIP DOWNLOADED! ${totalHours}h = $${(parseFloat(totalHours)*150).toFixed(0)} value!`;
}
</script>
</body>
</html>
